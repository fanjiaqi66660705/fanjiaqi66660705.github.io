<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="范嘉琪 · 河南大学思想政治教育专业准大一 · 文化传播 · AI内容创作 · 中国舞 · 田野调研">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a16">
<meta name="format-detection" content="telephone=no">
<link rel="preload" as="image" href="头像.jpg" fetchpriority="high">
<title>范嘉琪 · 个人简历</title>
<style>
/* ============================================================
   霓虹极光 · 玻璃拟态 · 移动优先
   ============================================================ */
:root{
  --bg:#070a16;            /* 深空底色（默认暗色=主视觉） */
  --bg-2:#0b1126;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.1);
  --border-2:rgba(255,255,255,.18);
  --text:#e9edf9;
  --muted:#9aa4c2;
  --c1:#22d3ee; --c2:#818cf8; --c3:#c084fc; --c4:#f472b6;
  --grad:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));
  --grad-bg:linear-gradient(135deg,var(--c1),var(--c2),var(--c3),var(--c4));
  --glow:0 0 26px rgba(129,140,248,.45);
  --glow-soft:0 0 14px rgba(129,140,248,.25);
  --shadow:0 18px 50px rgba(2,5,20,.55);
  --radius:18px;
  --nav-h:62px;
}
[data-theme="light"]{
  --bg:#eef1fb; --bg-2:#e3e9f8;
  --surface:rgba(255,255,255,.62);
  --surface-2:rgba(255,255,255,.85);
  --border:rgba(30,41,59,.1);
  --border-2:rgba(30,41,59,.16);
  --text:#182238;
  --muted:#5d6881;
  --glow:0 8px 26px rgba(99,102,241,.2);
  --glow-soft:0 4px 12px rgba(99,102,241,.14);
  --shadow:0 14px 40px rgba(30,41,59,.12);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
  .fill{transition:none!important;width:var(--p)!important}
  .marq-track{animation:none!important}
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 10px)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.75;min-height:100vh;
  -webkit-font-smoothing:antialiased;transition:background .4s,color .4s;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
a,button,.g-card,.tilt{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}

/* ---------- 极光背景 ---------- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.bg::before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(60% 46% at 12% 8%, rgba(34,211,238,.16), transparent 62%),
    radial-gradient(52% 44% at 88% 14%, rgba(192,132,252,.18), transparent 62%),
    radial-gradient(58% 52% at 74% 92%, rgba(244,114,182,.13), transparent 62%),
    radial-gradient(42% 40% at 18% 88%, rgba(129,140,248,.16), transparent 62%);
}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(rgba(148,170,255,.28) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(80% 70% at 50% 20%,#000,transparent 78%);
  mask-image:radial-gradient(80% 70% at 50% 20%,#000,transparent 78%);
}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform;pointer-events:none}
.blob.b1{width:46vmax;height:46vmax;background:#12b5d8;top:-16vmax;left:-12vmax;animation:drift1 20s ease-in-out infinite alternate}
.blob.b2{width:42vmax;height:42vmax;background:#7c6cf0;top:18%;right:-16vmax;animation:drift2 26s ease-in-out infinite alternate}
.blob.b3{width:38vmax;height:38vmax;background:#e35ea6;bottom:-18vmax;left:22%;animation:drift3 23s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(12vw,9vh) scale(1.18)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-10vw,-7vh) scale(1.14)}}
@keyframes drift3{from{transform:translate(0,0) scale(1)}to{transform:translate(-8vw,8vh) scale(1.2)}}

/* 全屏动态粒子层（介于极光底与内容之间） */
#bgFx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* 进阶极光光斑层（body::before，放大 200% 沿复杂路径流动） */
body::before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(circle at 50% 50%,rgba(76,29,149,.5),transparent 60%),
    radial-gradient(circle at 80% 20%,rgba(14,165,233,.4),transparent 50%),
    radial-gradient(circle at 20% 80%,rgba(236,72,153,.3),transparent 50%);
  filter:blur(100px);animation:fluid-flow 20s infinite linear}
@keyframes fluid-flow{0%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(5%,5%) rotate(5deg)}66%{transform:translate(-5%,2%) rotate(-5deg)}100%{transform:translate(0,0) rotate(0deg)}}
[data-theme="light"] body::before{opacity:.35;filter:blur(110px)}

/* 光标辉光（仅桌面，跟随鼠标） */
#cursorGlow{position:fixed;top:0;left:0;width:340px;height:340px;border-radius:50%;
  pointer-events:none;z-index:1;opacity:0;will-change:transform;
  background:radial-gradient(circle,rgba(129,140,248,.16),transparent 62%)}
@media(hover:none),(max-width:719px){#cursorGlow{display:none}}

/* 滚动进度条 */
#scrollBar{position:fixed;top:0;left:0;height:3px;width:0;z-index:300;
  background:var(--grad);box-shadow:var(--glow-soft)}

/* ---------- 通用文字渐变 ---------- */
.gtext{background:var(--grad);background-size:220% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:gshift 6s linear infinite}
@keyframes gshift{to{background-position:220% center}}

/* ---------- Nav ---------- */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--border)}
.nav-in{max-width:1100px;margin:0 auto;height:100%;display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{font-weight:900;font-size:1.08rem;letter-spacing:.5px;margin-right:auto;flex:none;display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:var(--grad-bg);display:grid;place-items:center;
  font-size:.8rem;color:#fff;box-shadow:var(--glow-soft);flex:none;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(129,140,248,.35)}50%{box-shadow:0 0 20px rgba(192,132,252,.7)}}
.nav-links{display:flex;gap:2px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{position:relative;color:var(--muted);text-decoration:none;font-size:.9rem;padding:0 12px;min-height:44px;
  display:inline-flex;align-items:center;border-radius:10px;white-space:nowrap;flex:none;transition:color .25s}
.nav-links a::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;
  background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--text);font-weight:700}
.nav-links a.active::after{transform:scaleX(1)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center;flex:none;
  backdrop-filter:blur(8px);transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--c2);box-shadow:var(--glow-soft)}
.icon-btn svg{width:19px;height:19px}
@media(min-width:720px){
  .wrap{padding:0 24px}
  .nav-in{padding:0 24px}
  .nav-links{overflow:visible}
  .nav-links a{min-height:auto;padding:8px 13px}
  .icon-btn{width:40px;height:40px}
}

/* ---------- Hero ---------- */
.hero{position:relative;padding:calc(var(--nav-h) + 44px) 0 30px;overflow:hidden}
#pxCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.85}
.hero-in{position:relative;z-index:2}
.hero-top{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.avatar-wrap{position:relative;flex:none}
.avatar{width:104px;height:104px;border-radius:30px;padding:3px;position:relative;
  background:conic-gradient(from var(--a,0deg),var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));
  animation:ring 7s linear infinite;box-shadow:0 0 34px rgba(129,140,248,.4)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ring{to{--a:360deg}}
.avatar::before{content:"";position:absolute;inset:3px;border-radius:27px;background:var(--bg-2)}
.avatar img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:cover;border-radius:27px}
.avatar .spin{position:absolute;inset:3px;border-radius:27px;overflow:hidden;display:grid;place-items:center;
  color:#fff;font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--bg-2),#16204a)}
.avatar .spin img{position:static;width:100%;height:100%}
.hero-meta{min-width:0;flex:1 1 300px}
.hero-meta .hey{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted);
  border:1px solid var(--border);padding:5px 14px;border-radius:30px;background:var(--surface);
  backdrop-filter:blur(8px);margin-bottom:14px}
.hey .dot{width:8px;height:8px;border-radius:50%;background:var(--c3);box-shadow:0 0 10px var(--c3);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hero-meta h1{font-size:clamp(2.1rem,9vw,3.6rem);font-weight:900;line-height:1.08;letter-spacing:.5px;margin:0}
.tagline{font-size:clamp(1rem,3.4vw,1.15rem);font-weight:700;color:var(--text);margin:12px 0 2px}
.sub{color:var(--muted);max-width:640px;font-size:.96rem;margin-top:8px}
.type-wrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin-top:10px;min-height:26px;flex-wrap:wrap}
.type-wrap .lab{font-weight:600;color:var(--muted)}
.type-role{color:var(--text);font-weight:700}
.cursor{display:inline-block;width:2px;height:1.05em;background:var(--c3);margin-left:2px;vertical-align:-2px;
  animation:cur 1s steps(2) infinite;box-shadow:0 0 8px var(--c3)}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
.hero-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;
  padding:12px 22px;border-radius:14px;font-weight:700;font-size:.94rem;text-decoration:none;cursor:pointer;
  border:none;color:#fff;background:var(--grad-bg);background-size:180% auto;overflow:hidden;
  box-shadow:0 8px 26px rgba(129,140,248,.4);transition:transform .2s,box-shadow .25s;animation:gshift 6s linear infinite}
.btn::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-20deg);transition:left .6s}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(129,140,248,.55)}
.btn:hover::before{left:160%}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border-2);
  box-shadow:none;backdrop-filter:blur(10px);animation:none}
.btn.ghost::before{display:none}
.btn.ghost:hover{border-color:var(--c2);box-shadow:var(--glow-soft);color:var(--text)}
.btn svg{width:17px;height:17px}
.scroll-cue{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);
  font-size:.78rem;letter-spacing:2px;margin:34px auto 0;width:fit-content}
.scroll-cue .wheel{width:24px;height:38px;border:2px solid var(--muted);border-radius:14px;position:relative}
.scroll-cue .wheel::before{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;border-radius:4px;
  background:var(--c3);transform:translateX(-50%);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,12px)}}
@media(min-width:720px){
  .hero{padding:calc(var(--nav-h) + 80px) 0 40px}
  .hero-top{gap:44px}
  .avatar{width:136px;height:136px;border-radius:38px}
  .avatar::before,.avatar .spin{border-radius:35px}
  .avatar img{border-radius:35px}
  .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
  .btn{justify-content:flex-start}
}

/* 跑马灯 */
.marquee{position:relative;z-index:2;margin:26px 0 0;padding:14px 0;overflow:hidden;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(8px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq-track{display:flex;width:max-content;animation:marq 30s linear infinite}
.marq-track span{white-space:nowrap;font-weight:700;font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:44px;padding-right:44px}
.marq-track span::after{content:"✦";color:var(--c3);text-shadow:0 0 8px var(--c3)}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- Section ---------- */
section{position:relative;padding:44px 0;border-top:1px solid var(--border);
  content-visibility:auto;contain-intrinsic-size:auto 620px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:24px}
.sec-head .n{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  font-weight:800;font-size:.95rem;color:#fff;background:var(--grad-bg);box-shadow:var(--glow-soft);flex:none}
.sec-head .n::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:1px solid rgba(129,140,248,.35);
  animation:pulse 3s ease-in-out infinite}
.sec-head h2{font-size:clamp(1.4rem,5vw,1.75rem);font-weight:900;letter-spacing:.5px}
.sec-head .line{flex:1;height:1px;min-width:30px;background:linear-gradient(90deg,var(--border),transparent)}
.sec-head p{color:var(--muted);font-size:.85rem;flex-basis:100%;padding-left:54px;order:3}
@media(min-width:720px){
  section{padding:60px 0}
  .sec-head{flex-wrap:nowrap;margin-bottom:32px}
  .sec-head p{margin-left:auto;flex-basis:auto;padding-left:0;order:0}
}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 12px 22px;text-align:center;overflow:hidden;backdrop-filter:blur(10px);
  box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.stat::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 0%,rgba(129,140,248,.18),transparent 70%);opacity:0;transition:opacity .3s}
.stat:hover{transform:translateY(-6px);border-color:var(--c2);box-shadow:var(--glow)}
.stat:hover::before{opacity:1}
.stat b{display:block;font-size:clamp(2.9rem,12vw,4rem);font-weight:900;letter-spacing:.5px;line-height:1;background:var(--grad);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gshift 6s linear infinite;filter:drop-shadow(0 0 12px rgba(129,140,248,.4))}
.stat span{display:block;color:var(--muted);font-size:.9rem;margin-top:7px;font-weight:600}
@media(min-width:720px){
  .stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
  .stat{padding:30px 16px 28px}
  .stat b{font-size:clamp(3.2rem,6.5vw,4.6rem)}
  .stat span{font-size:.95rem}
}

/* Tabs */
.tabs{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.tablist{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 45%,transparent);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{background:transparent;border:none;cursor:pointer;padding:10px 16px;min-height:44px;border-radius:11px;flex:none;
  font-weight:700;font-size:.92rem;color:var(--muted);transition:all .25s;position:relative}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--grad-bg);color:#fff;box-shadow:0 8px 22px rgba(129,140,248,.4)}
.tabpanel{padding:16px 16px 20px}
[role="tabpanel"][hidden]{display:none}
@media(min-width:720px){
  .tablist{flex-wrap:wrap;overflow:visible;padding:12px}
  .tab{padding:10px 20px}
  .tabpanel{padding:10px 24px 24px}
}

/* timeline */
.tl-item{padding:20px 0 4px;border-left:2px solid var(--border);margin-left:8px;padding-left:26px;position:relative}
.tl-item::before{content:"";position:absolute;left:-7px;top:26px;width:12px;height:12px;border-radius:50%;
  background:var(--grad-bg);box-shadow:0 0 0 4px rgba(129,140,248,.16),0 0 12px rgba(192,132,252,.8)}
.tl-head{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tl-head h3{font-size:1.06rem;font-weight:800}
.tl-head .role{color:var(--c3);font-weight:700;font-size:.92rem}
.tl-head .date{color:var(--muted);font-size:.82rem;background:color-mix(in srgb,var(--c2) 14%,transparent);
  border:1px solid var(--border);padding:3px 12px;border-radius:30px;align-self:flex-start}
.tl-item ul{margin:10px 0 0;padding-left:18px;color:var(--text);font-size:.94rem}
.tl-item li{margin-bottom:6px}
.tl-item li::marker{color:var(--c3)}
@media(min-width:720px){
  .tl-head{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
  .tl-head .date{align-self:center}
}

/* cards / grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;overflow:hidden;backdrop-filter:blur(10px);box-shadow:var(--shadow);transform-style:preserve-3d;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-bg)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(129,140,248,.12),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover{box-shadow:var(--glow);border-color:var(--border-2)}
.card:hover::after{opacity:1}
.project-card{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.project-card:hover{transform:translateY(-5px);border-color:var(--c2);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.card h3{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:8px}
.card .link{color:var(--c2);text-decoration:none;font-size:.85rem;margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:600}
.card p{color:var(--muted);font-size:.92rem;margin:10px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;padding:4px 12px;border-radius:30px;background:color-mix(in srgb,var(--c2) 16%,transparent);
  color:var(--c2);font-weight:700;border:1px solid color-mix(in srgb,var(--c2) 30%,transparent)}
.chip.alt{background:color-mix(in srgb,var(--c4) 16%,transparent);color:var(--c4);border-color:color-mix(in srgb,var(--c4) 30%,transparent)}
.result{font-size:.88rem;color:var(--text);margin-top:14px;padding:12px 14px;border-radius:12px;
  background:color-mix(in srgb,var(--c1) 8%,transparent);border-left:3px solid var(--c1)}

/* skills matrix */
.matrix{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.m-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);transform-style:preserve-3d;transition:transform .25s,box-shadow .25s,border-color .25s}
.m-card:hover{border-color:var(--border-2);box-shadow:var(--glow)}
.m-card h4{font-size:1rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.m-card h4 svg{width:18px;height:18px;color:var(--c3)}
.skill{margin-bottom:15px}
.skill .lab{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;margin-bottom:6px}
.skill .lab em{font-style:normal;color:var(--muted);font-size:.8rem}
.skill .bar{height:9px;border-radius:30px;background:color-mix(in srgb,var(--border) 55%,transparent);overflow:hidden;position:relative}
.skill .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,255,255,.06) 14px 15px)}
.skill .fill{height:100%;border-radius:30px;background:var(--grad-bg);background-size:180% auto;--p:0;width:0;
  box-shadow:0 0 12px rgba(129,140,248,.55);transition:width 1.1s cubic-bezier(.22,.8,.3,1)}
.skill .fill.go{width:var(--p);animation:gshift 5s linear infinite}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:30px;background:var(--surface);
  border:1px solid var(--border);font-size:.9rem;font-weight:600;box-shadow:var(--shadow);
  backdrop-filter:blur(8px);transition:transform .25s,border-color .25s,box-shadow .25s}
.badge:hover{transform:translateY(-3px);border-color:var(--c2);box-shadow:var(--glow-soft)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--grad-bg);box-shadow:0 0 8px var(--c3)}

/* list line */
.list-line{list-style:none}
.list-line li{position:relative;padding:0 0 18px 26px;border-left:2px solid var(--border);margin-left:8px}
.list-line li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--grad-bg);box-shadow:0 0 10px rgba(192,132,252,.7)}
.list-line h3{font-size:1.03rem;font-weight:800}
.list-line .date{display:block;margin-top:2px;color:var(--muted);font-size:.82rem}
.list-line p{color:var(--muted);font-size:.92rem;margin-top:4px}
@media(min-width:720px){
  .list-line .date{float:right;margin-top:0}
}

/* contact */
.contact-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.contact-grid .cval{color:var(--text);margin-top:10px}
.kv{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.9rem;color:var(--text)}
.kv svg{width:17px;height:17px;color:var(--c3);flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem}
.contact-grid .card h3 svg{width:18px;height:18px;color:var(--c3)}

/* honor groups */
#honorGrid{grid-template-columns:1fr;gap:18px;align-items:start}
.honor-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);transition:transform .25s,box-shadow .25s,border-color .25s}
.honor-group:hover{border-color:var(--border-2);box-shadow:var(--glow)}
.honor-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:14px;
  border-bottom:1px solid var(--border)}
.honor-head svg{width:20px;height:20px;color:var(--c3);flex:none}
.honor-head h3{font-size:1.12rem;font-weight:800}
.honor-group .list-line{margin-top:2px}

/* footer */
footer{padding:30px 0 46px;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem;position:relative}
footer .f-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
footer .grad-line{position:absolute;top:-1px;left:0;right:0;height:1px;background:var(--grad-bg);opacity:.5}

/* back to top */
#toTop{position:fixed;right:20px;bottom:28px;width:46px;height:46px;border-radius:14px;border:none;cursor:pointer;
  background:var(--grad-bg);color:#fff;display:grid;place-items:center;box-shadow:var(--glow);
  opacity:0;visibility:hidden;transform:translateY(12px);transition:all .3s;z-index:90}
#toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
#toTop:hover{transform:translateY(-3px);box-shadow:0 0 30px rgba(192,132,252,.8)}
#toTop svg{width:20px;height:20px}

/* floating background music player */
#bgMusic{position:fixed;top:calc(var(--nav-h) + 10px);right:18px;z-index:95;width:56px;height:56px;border-radius:50%;
  border:1px solid var(--border-2);background:var(--surface);cursor:pointer;padding:0;
  backdrop-filter:blur(12px);display:grid;place-items:center;box-shadow:var(--shadow);
  transition:transform .25s,border-color .25s,box-shadow .25s}
#bgMusic:hover{transform:translateY(-3px);border-color:var(--c2);box-shadow:var(--glow)}
#bgMusic .disc{position:absolute;inset:3px;border-radius:50%;background-color:#0b1126;
  background-size:cover;background-position:center;opacity:.92}
#bgMusic .disc::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:radial-gradient(circle at 50% 50%,rgba(7,10,22,.72) 0 26%,transparent 27% 60%,rgba(255,255,255,.18) 61% 63%,transparent 64%)}
#bgMusic .bicon{position:relative;z-index:2;width:20px;height:20px;color:#fff;display:grid;place-items:center;
  filter:drop-shadow(0 0 6px rgba(129,140,248,.8))}
#bgMusic .bicon svg{width:20px;height:20px}
#bgMusic .eq{position:absolute;top:-12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;
  align-items:flex-end;height:12px;opacity:0;transition:opacity .3s}
#bgMusic .eq i{width:3px;height:4px;border-radius:2px;background:var(--grad-bg);display:none;opacity:.9}
#bgMusic.playing .disc{animation:spin 7s linear infinite}
#bgMusic.playing .eq i{display:block;animation:eq 1s ease-in-out infinite}
#bgMusic.playing .eq i:nth-child(1){animation-delay:0s}
#bgMusic.playing .eq i:nth-child(2){animation-delay:.2s}
#bgMusic.playing .eq i:nth-child(3){animation-delay:.38s}
#bgMusic.playing .eq{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
@media (min-width:720px){#bgMusic{top:calc(var(--nav-h) + 12px);right:24px}}

/* toast */
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
  padding:12px 22px;border-radius:14px;font-size:.88rem;font-weight:600;opacity:0;visibility:hidden;
  transition:all .3s;z-index:200;box-shadow:var(--shadow)}
#toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* Gallery */
.g-group{margin-bottom:28px}
.g-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.g-head svg{width:20px;height:20px;color:var(--c3);flex:none}
.g-head h3{font-size:1.06rem;font-weight:800}
.g-head .cnt{color:var(--muted);font-size:.85rem}
.g-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g-card{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);
  background:var(--surface);cursor:zoom-in;margin:0;aspect-ratio:4/3;transform-style:preserve-3d;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.g-card::after{content:"";position:absolute;inset:0;border:1px solid transparent;border-radius:var(--radius);
  transition:border-color .3s;pointer-events:none}
.g-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.g-card.contain{background:color-mix(in srgb,var(--c2) 7%,transparent)}
.g-card.contain img{object-fit:contain;padding:8px}
.g-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 11px;font-size:.82rem;color:#fff;
  background:linear-gradient(transparent,rgba(4,8,22,.82));transition:opacity .25s;pointer-events:none}
.g-cap::before{content:"✦ ";color:#fff;text-shadow:0 0 8px #fff}
@media(hover:hover){
  .g-card:hover{transform:translateY(-5px) scale(1.01);box-shadow:var(--glow);border-color:var(--c2)}
  .g-card:hover img{transform:scale(1.06)}
  .g-card:hover::after{border-color:rgba(129,140,248,.5)}
  .g-cap{opacity:0}
  .g-card:hover .g-cap,.g-card:focus-visible .g-cap{opacity:1}
}
@media(min-width:720px){
  .g-group{margin-bottom:32px}
  .g-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .g-card.contain img{padding:10px}
  .g-cap{font-size:.86rem}
}
#lightbox{position:fixed;inset:0;z-index:200;background:rgba(4,7,18,.92);display:none;place-items:center;padding:16px;cursor:zoom-out;backdrop-filter:blur(6px)}
#lightbox.show{display:grid;animation:lbIn .25s ease}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:94vw;max-height:82vh;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(129,140,248,.25)}
#lightbox .lb-cap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#e9edf9;font-size:.86rem}
@media(min-width:720px){
  #lightbox{padding:28px}
  #lightbox img{max-width:min(92vw,980px);max-height:84vh}
  #lightbox .lb-cap{font-size:.92rem}
}

/* Music 海绵音乐播放器 */
.music-grid{display:grid;grid-template-columns:1fr;gap:18px}
.music-card{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  border:1px solid var(--border);box-shadow:var(--shadow);min-height:190px;isolation:isolate;
  display:flex;flex-direction:column;justify-content:flex-end;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.music-card:hover{border-color:var(--border-2);box-shadow:var(--glow);transform:translateY(-3px)}
.music-cover{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;
  transition:transform .5s ease;background-color:#0b1126}
.music-card:hover .music-cover{transform:scale(1.06)}
.music-cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(5,8,20,.08) 30%,rgba(5,8,20,.32) 55%,rgba(5,8,20,.9) 100%)}
.music-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:62px;height:62px;
  border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(7,10,22,.42);backdrop-filter:blur(6px);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px rgba(0,0,0,.45);transition:background .25s,transform .25s}
.music-play::before{content:"";width:0;height:0;margin-left:5px;border-top:11px solid transparent;
  border-bottom:11px solid transparent;border-left:17px solid currentColor}
.music-card:hover .music-play,.music-card:focus-visible .music-play{background:rgba(129,140,248,.75);transform:translate(-50%,-50%) scale(1.08)}
.music-meta{position:relative;z-index:1;padding:14px 16px 16px;color:#fff;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.music-badge{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:30px;color:#e9edf9;width:max-content;
  background:rgba(7,10,22,.5);border:1px solid rgba(255,255,255,.25)}
.music-meta h3{font-size:1.1rem;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.music-hint{font-size:.76rem;color:rgba(233,237,249,.85)}
/* 播放弹层（同一时间只播放一首） */
.music-modal{position:fixed;inset:0;z-index:220;background:rgba(4,7,18,.92);display:none;place-items:center;
  padding:16px;backdrop-filter:blur(6px)}
.music-modal.show{display:grid;animation:lbIn .25s ease}
.music-modal-box{position:relative;width:100%;max-width:420px;background:var(--surface);
  border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.music-close{position:absolute;top:12px;right:12px;z-index:3;width:44px;height:44px;border-radius:50%;font-size:1.5rem;line-height:1;
  border:1px solid rgba(255,255,255,.3);background:rgba(7,10,22,.5);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .25s}
.music-close:hover{background:rgba(129,140,248,.6)}
.music-cover-big{width:100%;aspect-ratio:1/1;background-size:cover;background-position:center;background-color:#0b1126}
.music-info{padding:16px 18px 20px;display:flex;flex-direction:column;gap:10px}
.music-info h3{font-size:1.15rem;font-weight:800}
.music-info audio{width:100%;height:46px}
/* 小游戏弹层 */
.play-game{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:10px 18px;min-height:44px;
  border:none;border-radius:999px;background:var(--grad);background-size:220% auto;color:#fff;font-size:.92rem;
  font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(129,140,248,.35);animation:gshift 6s linear infinite;
  transition:transform .2s,box-shadow .25s}
.play-game:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(129,140,248,.5)}
.play-game:active{transform:translateY(0)}
.game-modal{position:fixed;inset:0;z-index:230;background:rgba(4,7,18,.94);display:none;place-items:center;
  padding:12px;backdrop-filter:blur(6px)}
.game-modal.show{display:grid;animation:lbIn .25s ease}
.game-modal-box{position:relative;width:100%;height:100%;max-height:96vh;background:var(--surface);
  border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.game-modal-box iframe{width:100%;height:100%;border:0;display:block;background:#000}
.game-close{position:absolute;top:12px;right:12px;z-index:3;width:44px;height:44px;min-height:44px;border-radius:50%;font-size:1.5rem;line-height:1;
  border:1px solid rgba(255,255,255,.35);background:rgba(7,10,22,.6);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .25s}
.game-close:hover{background:rgba(129,140,248,.6)}
@media(min-width:720px){
  .game-modal-box{max-width:960px;aspect-ratio:16/10}
}

@media print{
  @page{margin:12mm}
  :root{--bg:#fff;--bg-2:#fff;--surface:#fff;--border:#ddd;--text:#111;--muted:#555;--shadow:none;--glow:none}
  body{background:#fff;color:#111}
  .bg,.blob,#bgFx,#pxCanvas,#cursorGlow,#scrollBar,nav,#toTop,#bgMusic,audio,footer>div a,.hero-actions,.marquee,#lightbox,.scroll-cue,.music-modal{display:none!important}
  .reveal{opacity:1;transform:none}
  .fill{width:var(--p)!important}
  .gtext{background:none;-webkit-text-fill-color:#111;animation:none}
  .stat b{background:none;-webkit-text-fill-color:#111;animation:none}
  section{padding:18px 0;border-color:#e5e5e5;break-inside:avoid;content-visibility:visible}
  .tl-item,.list-line li{break-inside:avoid}
  .hero{padding-top:10px}
  .badge,.chip{border:1px solid #ccc}
  .stat,.card,.m-card,.honor-group,.tabs{border:1px solid #ddd;backdrop-filter:none}
  .g-group{break-inside:avoid}
  .g-card{break-inside:avoid;transform:none}
  .g-card .g-cap{opacity:1;position:static;background:none;color:#555;padding:6px 2px 0}
  .g-cap::before{content:""}
  .g-grid{grid-template-columns:repeat(3,1fr);gap:10px}
}
</style>
</head>
<body>

<!-- 极光背景 -->
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<canvas id="bgFx" aria-hidden="true"></canvas>
<div id="cursorGlow" aria-hidden="true"></div>
<div id="scrollBar" aria-hidden="true"></div>

<!-- NAV -->
<nav>
  <div class="nav-in">
    <div class="brand"><span class="logo">嘉</span><span class="gtext">范嘉琪</span></div>
    <div class="nav-links" id="navLinks"></div>
    <button class="icon-btn" id="themeBtn" title="切换深浅色"></button>
    <button class="icon-btn" onclick="window.print()" title="打印 / 导出PDF" aria-label="打印/导出PDF"></button>

</nav>

<!-- HERO -->
<header class="hero" id="hero">

      </div>

        <p class="sub" id="introEl"></p>

          <a class="btn" href="#" data-mail target="_blank"></a>

</header>

<!-- MARQUEE -->
<div class="marquee" aria-hidden="true"><div class="marq-track" id="marqTrack"></div></div>

<!-- STATS -->
<section id="stats">
  <div class="wrap">
    <div class="sec-head"><span class="n">01</span><h2>亮点成果</h2><span class="line"></span><p>可量化成绩一览</p></div>
    <div class="stats" id="statsEl"></div>
  </div>
</section>

<!-- EXPERIENCE -->
<section id="experience">
  <div class="wrap">
    <div class="sec-head"><span class="n">02</span><h2>实践与演出经历</h2><span class="line"></span><p>按类别切换查看</p></div>
    <div class="tabs">
      <div class="tablist" role="tablist" id="expTablist"></div>
      <div id="expPanels"></div>
    </div>

</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="wrap">
    <div class="sec-head"><span class="n">03</span><h2>项目与作品</h2><span class="line"></span><p>独立创作与调研成果</p></div>
    <div class="tabs">
      <div class="tablist" role="tablist" id="projTablist"></div>
      <div id="projPanels"></div>

<!-- GALLERY -->
<section id="gallery">
  <div class="wrap">
    <div class="sec-head"><span class="n">04</span><h2>作品与影像集</h2><span class="line"></span><p>舞台 · 调研 · 证书 · 摄影，点击图片放大查看</p></div>
    <div id="galleryEl"></div>
  </div>
</section>

<section id="music">
  <div class="wrap">
    <div class="sec-head"><span class="n">05</span><h2>原创音乐</h2><span class="line"></span><p>海绵音乐 · AI 原创单曲，点击播放</p></div>
    <div class="music-grid" id="musicEl"></div>
  </div>
</section>

<!-- SKILLS -->
<section id="skills">
  <div class="wrap">
    <div class="sec-head"><span class="n">06</span><h2>技能矩阵</h2><span class="line"></span></div>
    <div class="matrix" id="matrixEl"></div>
  </div>
</section>

<!-- EDUCATION -->
<section id="education">
  <div class="wrap">
    <div class="sec-head"><span class="n">07</span><h2>教育背景</h2><span class="line"></span></div>
    <ul class="list-line" id="eduEl"></ul>
  </div>
</section>

<!-- HONOR -->
<section id="honor">
  <div class="wrap">
    <div class="sec-head"><span class="n">08</span><h2>获奖与证书</h2><span class="line"></span></div>
    <div class="grid" id="honorGrid"></div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="wrap">
    <div class="sec-head"><span class="n">09</span><h2>联系方式</h2><span class="line"></span></div>
    <div class="grid contact-grid" id="contactGrid"></div>
  </div>
</section>

<footer>
  <div class="grad-line"></div>
  <div class="wrap f-in">
    <span>© <span id="yearEl"></span> 范嘉琪 · 个人简历 <span style="color:var(--c3)">✦</span></span>
    <span>最后更新：<span id="dateEl"></span></span>
  </div>
</footer>

<button id="toTop" title="返回顶部"></button>
<button id="bgMusic" title="背景音乐" aria-label="背景音乐播放/暂停">
  <span class="disc" id="bgDisc"></span>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="bicon" id="bgIcon"></span>
</button>
<audio id="bgAudio" loop autoplay preload="auto" playsinline></audio>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览"></div>

function copyMail(){
  const text = buildMail();
  const done = () => toast('邮箱已复制到剪贴板');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(()=>legacyCopy(text, done));
  } else { legacyCopy(text, done); }
}
function legacyCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败，请手动复制：'+text); }
  document.body.removeChild(ta);
}

/* ---------- Tabs（ARIA + 键盘） ---------- */
function buildTabs(listEl, panelEl, groups){
  let id = 0;
  groups.forEach(g => {
    const tab = el('button','tab', g.tab);
    tab.setAttribute('role','tab');
    tab.id = 'tab-'+id;
    tab.setAttribute('aria-controls','panel-'+id);
    tab.setAttribute('aria-selected', id===0);
    tab.setAttribute('tabindex', id===0?'0':'-1');
    tab.dataset.panel = id;
    listEl.appendChild(tab);

    const panel = el('div','tabpanel');
    panel.id = 'panel-'+id;
    panel.setAttribute('role','tabpanel');
    panel.setAttribute('aria-labelledby','tab-'+id);
    panel.hidden = id!==0;
    renderPanel(panel, g);
    panelEl.appendChild(panel);
    id++;
  });
  const tabs = [...listEl.children];
  const select = i => {
    tabs.forEach((t,idx)=>{ const on=idx===i; t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1; });
    panelEl.querySelectorAll('.tabpanel').forEach((p,idx)=>{ p.hidden = idx!==i; });
  };
  tabs.forEach((t,i)=>{
    t.onclick = ()=>select(i);
    t.onkeydown = e => {
      const n = tabs.length;
      let go = null;
      if (e.key==='ArrowRight') go=(i+1)%n;
      else if (e.key==='ArrowLeft') go=(i-1+n)%n;
      else if (e.key==='Home') go=0;
      else if (e.key==='End') go=n-1;
      if (go!==null){ e.preventDefault(); tabs[go].focus(); select(go); }
    };
  });
}

function renderPanel(panel, group){
  const wrap = el('div');
  if (group.items) {
    group.items.forEach(it => {
      const item = el('div','tl-item');
      item.innerHTML =
        '<div class="tl-head"><div><h3>'+it.org+'</h3><div class="role">'+it.role+'</div></div><div class="date">'+it.date+'</div></div>' +
        '<ul>'+it.points.map(p=>'<li>'+p+'</li>').join('')+'</ul>';
      wrap.appendChild(item);
    });
  }
  if (group.cards) {
    const g = el('div','grid');
    group.cards.forEach(c => {
      const card = el('div','card project-card tilt');
      card.innerHTML =
        '<h3>'+c.name+'<a class="link" href="'+c.link+'" title="查看详情">'+IC.link+'<span>详情</span></a></h3>' +
        '<div class="chips">'+c.tech.map((t,i)=>'<span class="chip'+(i%2?' alt':'')+'">'+t+'</span>').join('')+'</div>' +
        '<p>'+c.desc+'</p><div class="result">✦ 成果：'+c.result+'</div>';
      if (c.file) {
        const btn = el('button','play-game');
        btn.type = 'button';
        btn.innerHTML = IC.play + '<span>立即开玩</span>';
        btn.onclick = e => { e.preventDefault(); e.stopPropagation(); openGame(c.file); };
        card.appendChild(btn);
      }
      g.appendChild(card);
    });
    wrap.appendChild(g);
  }
  panel.appendChild(wrap);
}

const ROLES = ['AI 内容创作者','中国舞 · 十年舞台 C 位','田野调研者','国际模特 · 全球巡演','全栈数字创作者','文化传播新青年'];

} else {
  let ri = 0, ci = 0, del = false;
  (function type(){
    const word = ROLES[ri];
    typeRole.textContent = word.slice(0, ci);
    if (!del) {
      if (ci < word.length) { ci++; setTimeout(type, 90); }
      else { del = true; setTimeout(type, 1900); }

      if (ci > 0) { ci--; setTimeout(type, 42); }
      else { del = false; ri = (ri + 1) % ROLES.length; setTimeout(type, 350); }
    }
  })();
}

/* ============ 数字滚动 ============ */
function animateCount(el2){
  const raw = el2.textContent.trim();
  const m = raw.match(/^([\d.]+)(.*)$/);
  if (!m || reduceMotion) { el2.textContent = raw; return; }
  const target = parseFloat(m[0]), suffix = m[2];
  const dur = 1300, t0 = performance.now();
  const dec = (String(target).split('.')[1]||'').length;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el2.textContent = (target * e).toFixed(dec) + suffix;
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ============ 动画：淡入 + 进度条 ============ */
const io = new IntersectionObserver(es => {
  es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
    if (!reduceMotion) {
      e.target.querySelectorAll('.fill').forEach(f => f.classList.add('go'));
    } else {
      e.target.querySelectorAll('.fill').forEach(f => f.style.width = f.style.getPropertyValue('--p'));
    }
    // 数字滚动
    e.target.querySelectorAll('[data-count]').forEach(animateCount);
    io.unobserve(e.target);
  });
},{threshold:.15});
document.querySelectorAll('section, .tabs, .stat, .card, .m-card, .honor-group, .g-group').forEach((n,i) => {
  n.classList.add('reveal');
  n.style.transitionDelay = (i % 3) * .06 + 's';
  io.observe(n);
});

/* ============ 3D 倾斜（桌面端） ============ */
if (!reduceMotion && window.matchMedia('(min-width:720px) and (hover:hover)').matches) {
  const MAX = 7;
  document.querySelectorAll('.tilt').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5;
      const py = (e.clientY - r.top) / r.height - .5;
      card.style.transform = 'perspective(800px) rotateX(' + (-py * MAX) + 'deg) rotateY(' + (px * MAX) + 'deg) translateY(-4px)';

  });

/* ============ 粒子星网（Hero 内，减速偏好关闭） ============ */
if (!reduceMotion) {
  (function(){
    const cv = $('#pxCanvas'), ctx = cv.getContext('2d');
    let W, H, pts = [], raf, running = false;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    function size(){
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * DPR; cv.height = H * DPR;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const n = Math.min(70, Math.max(24, Math.floor(W / 16)));
      pts = Array.from({length:n}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-.5)*.35, vy: (Math.random()-.5)*.35,
        r: Math.random()*1.6 + .6
      }));
    }
    function tick(){
      ctx.clearRect(0,0,W,H);
      for (const p of pts){
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      }
      for (let i=0;i<pts.length;i++){
        for (let j=i+1;j<pts.length;j++){
          const a=pts[i], b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=dx*dx+dy*dy;
          if (d < 130*130){
            ctx.strokeStyle = 'rgba(140,160,255,' + (.16*(1-d/(130*130))) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      for (const p of pts){
        ctx.fillStyle = 'rgba(170,190,255,.9)';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    }
    const heroIO = new IntersectionObserver(en => {
      const on = en[0].isIntersecting;
      if (on && !running){ running = true; raf = requestAnimationFrame(tick); }
      else if (!on && running){ running = false; cancelAnimationFrame(raf); }
    }, {threshold:.05});
    window.addEventListener('resize', size);
    size(); heroIO.observe(heroEl);
  })();
}

    const COLORS = ['#22d3ee', '#818cf8', '#c084fc', '#f472b6'];
    let W = 0, H = 0, pts = [], raf = 0, t0 = performance.now();
    let mouse = { x: -9999, y: -9999, on: false };

    function rgba(hex, a){
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n>>16&255) + ',' + (n>>8&255) + ',' + (n&255) + ',' + a + ')';
    }
    /* 预渲染辉光精灵（每色一张离屏小图，避免每帧创建渐变） */
    const sprites = {};
    COLORS.forEach(c => {
      const s = document.createElement('canvas');
      s.width = s.height = 64;
      const g = s.getContext('2d');
      const grad = g.createRadialGradient(32,32,0,32,32,32);
      grad.addColorStop(0, rgba(c,.9));
      grad.addColorStop(.4, rgba(c,.32));
      grad.addColorStop(1, rgba(c,0));
      g.fillStyle = grad;
      g.fillRect(0,0,64,64);
      sprites[c] = s;
    });

    function size(){
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const n = Math.min(110, Math.max(40, Math.round(W*H/16000)));
      pts = Array.from({length:n}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-.5)*.5, vy: (Math.random()-.5)*.5,
        r: Math.random()*1.7 + .7,
        c: COLORS[Math.random()*COLORS.length|0],
        tw: Math.random()*Math.PI*2
      }));
    }
    function draw(t){
      const s = (t - t0)/1000;
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const K = isLight ? .5 : 1;
      const lineRGB = isLight ? '99,102,241' : '150,170,255';
      const LINK = 130, MR = 160;
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation = 'lighter';

      /* 位移 + 鼠标牵引（桌面端粒子被光标吸引） */
      for (const p of pts){
        if (mouse.on){
          const dx = mouse.x - p.x, dy = mouse.y - p.y, d2 = dx*dx + dy*dy;
          if (d2 < MR*MR && d2 > 1){
            const d = Math.sqrt(d2), f = (1 - d/MR) * .06;
            p.vx += dx/d * f; p.vy += dy/d * f;
          }
        }
        p.x += p.vx; p.y += p.vy;
        p.vx *= .995; p.vy *= .995;
        const sp = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
        if (sp > .7){ p.vx = p.vx/sp*.7; p.vy = p.vy/sp*.7; }
        if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
      }

      /* 星座连线（粒子之间 + 粒子与光标之间） */
      for (let i=0;i<pts.length;i++){
        const a = pts[i];
        for (let j=i+1;j<pts.length;j++){
          const b = pts[j], dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx + dy*dy;
          if (d2 < LINK*LINK){
            const al = (1 - Math.sqrt(d2)/LINK) * .16 * K;
            ctx.strokeStyle = 'rgba(' + lineRGB + ',' + al + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
        if (mouse.on){
          const dx = mouse.x - a.x, dy = mouse.y - a.y, d2 = dx*dx + dy*dy;
          if (d2 < MR*MR){
            const al = (1 - Math.sqrt(d2)/MR) * .28 * K;
            ctx.strokeStyle = 'rgba(' + lineRGB + ',' + al + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke();
          }
        }
      }

      /* 粒子辉光（精灵缩放 + 呼吸闪烁） */
      for (const p of pts){
        const tw = .72 + .28 * Math.sin(s*2 + p.tw);
        const size = p.r * 7 * (1.15 + .35 * Math.sin(s*1.4 + p.tw));
        ctx.globalAlpha = tw * K;
        ctx.drawImage(sprites[p.c], p.x - size/2, p.y - size/2, size, size);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      raf = requestAnimationFrame(draw);
    }
    size();
    window.addEventListener('resize', size);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; }, {passive:true});
    window.addEventListener('mouseleave', () => { mouse.on = false; mouse.x = mouse.y = -9999; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(raf);
      else raf = requestAnimationFrame(draw);
    });
    raf = requestAnimationFrame(draw);
  })();
}
</script>
</body>
</html>
