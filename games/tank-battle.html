<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浪尖儿 WavePeak Elite · 科技坦克大战</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #081226 0%, #050710 60%, #01030a 100%);
    overflow: hidden;
    font-family: 'Courier New', 'PingFang SC', 'Microsoft YaHei', monospace;
    color: #d7ecff;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border: 1px solid rgba(0,229,255,0.35);
    box-shadow: 0 0 40px rgba(0,229,255,0.18), 0 0 120px rgba(167,79,255,0.10);
    border-radius: 8px;
    background: #050a14;
    max-width: 96vw;
  }

  /* ---------- 屏幕覆盖层 ---------- */
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(2,5,12,0.86);
    backdrop-filter: blur(2px);
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  .screen.active { display: flex; }

  /* ---------- Logo 呼吸灯 ---------- */
  .logo {
    font-size: 56px;
    letter-spacing: 6px;
    font-weight: 700;
    color: #00e5ff;
    text-shadow: 0 0 8px #00e5ff, 0 0 22px #00b8ff, 0 0 50px rgba(0,229,255,0.7);
    animation: breathe 2.4s ease-in-out infinite;
  }
  .logo small {
    display: block;
    font-size: 16px;
    letter-spacing: 10px;
    color: #a74fff;
    text-shadow: 0 0 10px rgba(167,79,255,0.8);
    margin-top: 6px;
  }
  @keyframes breathe {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: .55; transform: scale(.98); }
  }

  .subtitle { color: #7fb6d8; letter-spacing: 4px; font-size: 13px; margin: 16px 0 8px; }
  .hint {
    font-size: 11px; color: #5f8aa8; letter-spacing: 1px; line-height: 1.9; margin-top: 10px;
  }
  .hint b { color: #00e5ff; }

  .modes { display: flex; gap: 14px; margin: 18px 0; }
  .mode-btn {
    width: 220px; padding: 18px 12px; cursor: pointer;
    border: 1px solid rgba(0,229,255,0.4); border-radius: 10px;
    background: linear-gradient(160deg, rgba(0,40,60,0.6), rgba(20,10,40,0.8));
    color: #cfe8ff; letter-spacing: 2px; font-size: 15px; font-family: inherit;
    transition: all .18s;
  }
  .mode-btn:hover { transform: translateY(-2px); box-shadow: 0 0 22px rgba(0,229,255,0.4); }
  .mode-btn .big { font-size: 22px; display: block; margin-bottom: 6px; }
  .mode-btn .desc { font-size: 11px; color: #7fb6d8; letter-spacing: 1px; }
  .mode-btn.selected {
    background: rgba(0,229,255,0.18);
    border-color: #00e5ff; color: #fff;
    box-shadow: 0 0 26px rgba(0,229,255,0.5), inset 0 0 20px rgba(0,229,255,0.15);
  }
  .mode-btn.female.selected {
    border-color: #ff8fd6; color: #fff;
    box-shadow: 0 0 26px rgba(255,143,214,0.5), inset 0 0 20px rgba(255,143,214,0.15);
  }

  .btn {
    margin-top: 16px; padding: 14px 60px; cursor: pointer;
    font-size: 17px; letter-spacing: 6px; font-family: inherit;
    color: #00e5ff; background: transparent;
    border: 1px solid rgba(0,229,255,0.5); border-radius: 8px;
    text-shadow: 0 0 10px rgba(0,229,255,0.6);
    transition: all .18s;
  }
  .btn:hover { background: rgba(0,229,255,0.15); box-shadow: 0 0 22px rgba(0,229,255,0.5); transform: translateY(-1px); }
  .btn.ghost { font-size: 12px; padding: 10px 26px; margin-top: 12px; letter-spacing: 3px; color: #7fb6d8; }

  /* 单/多人模式选择 */
  .playmodes { display: flex; gap: 10px; margin-top: 14px; }
  .pmode {
    padding: 9px 22px; cursor: pointer; font-size: 13px; letter-spacing: 3px;
    font-family: inherit; color: #7fb6d8;
    border: 1px solid rgba(127,182,216,0.4); border-radius: 20px; background: transparent;
    transition: all .15s;
  }
  .pmode:hover { color: #cfe8ff; box-shadow: 0 0 14px rgba(0,229,255,0.35); }
  .pmode.selected { color: #fff; border-color: #00e5ff; background: rgba(0,229,255,0.16); box-shadow: 0 0 16px rgba(0,229,255,0.4); }
  .screen.female .pmode.selected, body.female .pmode.selected {
    border-color: #ff8fd6; background: rgba(255,143,214,0.16); box-shadow: 0 0 16px rgba(255,143,214,0.4);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    padding: 12px 16px; font-size: 14px;
  }
  #hud.top { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; }
  .hud-left { display: flex; gap: 14px; align-items: center; }
  .hp { color: #ff5b7a; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,46,136,0.6); }
  .score { color: #ffe14a; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,213,74,0.5); }
  .rank { color: #a74fff; letter-spacing: 2px; font-weight: 700; text-shadow: 0 0 10px rgba(167,79,255,0.8); }
  .rank small { font-size: 11px; color: #7fb6d8; font-weight: 400; }
  .hpbar {
    position: absolute; left: 16px; bottom: 8px; z-index: 12;
    width: 170px; height: 15px; border-radius: 8px;
    border: 1px solid rgba(255,94,122,0.55);
    background: rgba(0,0,0,0.55); overflow: hidden;
    box-shadow: 0 0 10px rgba(255,94,122,0.25);
  }
  #hpFill { height: 100%; width: 100%; border-radius: 8px; transition: width .15s, background .2s; }
  #hpText { position: absolute; inset: 0; text-align: center; line-height: 15px; font-size: 10px; color: #fff; text-shadow: 0 0 4px #000; }
  .lvl { color: #00e5ff; text-shadow: 0 0 8px rgba(0,229,255,0.6); }

  #flash {
    position: absolute; inset: 0; z-index: 30; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,213,74,0.4) 60%, transparent 80%);
    opacity: 0;
  }
  #flash.go { animation: flashin .5s ease-out; }
  @keyframes flashin { 0% { opacity: 1; } 100% { opacity: 0; } }

  #overlay-msg {
    position: absolute; inset: 0; z-index: 15; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; letter-spacing: 8px; color: #ffe14a;
    text-shadow: 0 0 20px rgba(255,213,74,0.9);
    opacity: 0; font-weight: 700;
  }
  #overlay-msg.show { animation: msgfade 1.1s ease-out; }
  @keyframes msgfade { 0% { opacity: 0; transform: scale(.6);} 20% {opacity:1; transform: scale(1.05);} 70%{opacity:1;} 100% {opacity:0;} }

  .result-score { font-size: 40px; color: #ffe14a; text-shadow: 0 0 16px rgba(255,213,74,0.7); margin: 8px 0; }
  .result-rank { font-size: 24px; color: #a74fff; letter-spacing: 3px; margin-bottom: 6px; text-shadow: 0 0 14px rgba(167,79,255,0.8); }
  .res-line { font-size: 13px; color: #7fb6d8; line-height: 2; }
  .res-line span { color: #00e5ff; }

  /* —— 战机预览 + 段位预览 —— */
  .preview { display: flex; gap: 14px; align-items: stretch; justify-content: center;
    margin: 14px auto 4px; padding: 10px 14px; max-width: 520px;
    background: rgba(8,14,28,0.55); border: 1px solid rgba(0,229,255,0.28);
    border-radius: 14px; backdrop-filter: blur(4px); }
  .preview-tank { text-align: center; min-width: 108px; }
  #ptank { display: block; width: 108px; height: 108px; margin: 0 auto; }
  .ptank-name { display: inline-block; margin-top: 4px; font-size: 12px; color: #9be8ff;
    letter-spacing: 2px; }
  .preview-rank { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .preview-hd { font-size: 12px; color: #ffe14a; letter-spacing: 3px; }
  .rank-lane { display: flex; flex-wrap: wrap; gap: 4px; }
  .rank-lane .rk { font-size: 11px; padding: 3px 7px; border-radius: 10px;
    background: rgba(255,255,255,0.06); color: #6f8aa6; border: 1px solid rgba(255,255,255,0.08); }
  .rank-lane .rk.on { color: #00e5ff; border-color: rgba(0,229,255,0.5); }
  .rank-lane .rk.active { background: linear-gradient(#ffe14a,#ff9e1b); color: #2a1500;
    border-color: #ffe14a; box-shadow: 0 0 10px rgba(255,213,74,0.6); font-weight: 700; }
  .rank-note { font-size: 11px; color: #7fb6d8; line-height: 1.5; }

  /* —— 结算页段位进度 —— */
  .res-rankbar { max-width: 380px; margin: 10px auto 2px; }
  .res-rankbar-t { font-size: 13px; color: #ffd54a; margin-bottom: 6px; letter-spacing: 1px; }
  .res-rankbar-track { height: 10px; border-radius: 6px; background: rgba(255,255,255,0.10);
    border: 1px solid rgba(0,229,255,0.35); overflow: hidden; }
  .res-rankbar-fill { height: 100%; width: 0; border-radius: 6px;
    background: linear-gradient(90deg,#00e5ff,#ffe14a,#ff8fd6); transition: width .6s ease; }
  .res-rankbar-lbl { font-size: 12px; color: #8fbdfa; margin-top: 6px; text-align: center; }
  .res-boost { max-width: 420px; margin: 8px auto; font-size: 14px; color: #ffe14a;
    line-height: 1.7; text-shadow: 0 0 12px rgba(255,213,74,0.5); }

  /* —— 全屏升段横幅 —— */
  #rankup { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; z-index: 60; }
  #rankup.go { animation: rankanim 2.2s ease-out forwards; }
  .ru-in { text-align: center; padding: 18px 44px; border-radius: 18px;
    background: radial-gradient(circle at 50% 40%, rgba(10,20,45,0.92), rgba(5,8,20,0.96));
    border: 2px solid #ffe14a; box-shadow: 0 0 40px rgba(255,213,74,0.7); }
  .ru-title { font-size: 18px; color: #9be8ff; letter-spacing: 8px; }
  .ru-name { font-size: 52px; font-weight: 800; color: #ffe14a; margin: 6px 0;
    text-shadow: 0 0 24px rgba(255,213,74,0.9); }
  .ru-sub { font-size: 13px; color: #7fb6d8; letter-spacing: 2px; }
  @keyframes rankanim { 0% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1.06); }
    32% { transform: scale(1); } 72% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="top" style="display:none;">
      <div class="hud-left">
        <span class="lvl">LV <span id="hudLevel">1</span></span>
        <span class="score">SCORE <span id="hudScore">0</span></span>
      </div>
      <div class="hpbar"><div id="hpFill"></div><span id="hpText">3/3</span></div>
      <div class="rank" id="hudRankBox">段位 <span id="hudRank">青铜</span> <small>击杀 <span id="hudKills">0</span></small></div>
    </div>

    <!-- 主菜单 -->
    <div class="screen active" id="startScreen">
      <div class="logo">霓虹双界-坦克大战 <small>W-Peak: FJQ Mecha</small></div>
      <div class="subtitle">◆ 科技风 · 双模式 · FJQ 定制战场 ◆</div>
      <div class="modes">
        <button class="mode-btn selected" data-mode="male">
          <span class="big">＃ 硬核</span>
          <span class="desc">霓虹钢铁 / 高刺激 / 重型坦克 / 巨型Boss</span>
        </button>
        <button class="mode-btn female" data-mode="female">
          <span class="big">★ 舒缓</span>
          <span class="desc">梦幻柔和 / 慢节奏 / Q版坦克 / 魔法球</span>
        </button>
      </div>
      <div class="playmodes">
        <button class="pmode selected" data-p="solo">单人模式</button>
        <button class="pmode" data-p="duo">多人模式 · 本地双人合作</button>
      </div>
      <!-- 战机预览 + 段位预览 -->
      <div class="preview">
        <div class="preview-tank">
          <canvas id="ptank" width="216" height="216"></canvas>
          <span class="ptank-name" id="ptankName"></span>
        </div>
        <div class="preview-rank">
          <div class="preview-hd">✦ 段位预览</div>
          <div class="rank-lane" id="rankLane"></div>
          <div class="rank-note" id="rankNote"></div>
        </div>
      </div>
      <button class="btn" id="btnStart">开 始 战 斗</button>
      <div class="hint">
        单人：移动 <b>W A S D</b> ／ 射击 <b>空格</b><br/>
        双人：P1 <b>W A S D + 空格</b> ／ P2 <b>方向键 + 回车</b><br/>
        中央墙体拼出 <b>F J Q</b> —— 浪尖儿大学生社区专属战场
      </div>
    </div>

    <!-- 结算页 -->
    <div class="screen" id="endScreen">
      <div class="logo" style="font-size:38px;">浪尖儿 <small>WAVE PEAK ELITE</small></div>
      <div class="result-rank" id="endRank">达成段位：青铜</div>
      <div class="result-score" id="endScore">0</div>
      <div class="res-line">最终击杀 <span id="endKills">0</span> · 火力等级 <span id="endLvl">1</span> · 模式 <span id="endMode">硬核</span></div>
      <!-- 段位进度 + 再战文案 -->
      <div class="res-rankbar">
        <div class="res-rankbar-t" id="endRankTip"></div>
        <div class="res-rankbar-track"><div class="res-rankbar-fill" id="endRankFill"></div></div>
        <div class="res-rankbar-lbl" id="endRankLabel"></div>
      </div>
      <div class="res-boost" id="endBoost"></div>
      <button class="btn" id="btnRetry">再 战 一 局</button>
      <button class="btn ghost" id="btnMenu">返回主菜单</button>
    </div>

    <div id="overlay-msg"></div>
    <div id="flash"></div>
    <!-- 全屏升段横幅 -->
    <div id="rankup"><div class="ru-in">
      <div class="ru-title">段位晋升</div>
      <div class="ru-name" id="ruName">黄金</div>
      <div class="ru-sub" id="ruSub">技术碾压，向更高段位冲刺！</div>
    </div></div>
  </div>

<script>
"use strict";
/* =========================================================================
   浪尖儿 WavePeak Elite —— 单文件原生 Canvas 坦克大战（零外部依赖）
   全部图形用 Canvas API 绘制，音效用 WebAudio 振荡器实时合成。
   ========================================================================= */

/* ---------------- 基础画布 ---------------- */
const CELL = 40, COLS = 15, ROWS = 13, HUD_H = 40;
const W = COLS * CELL;            // 600
const PLAY_H = ROWS * CELL;       // 520
const H = HUD_H + PLAY_H;         // 560
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.max(1, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;
ctx.scale(DPR, DPR);

let mode = 'male';           // 'male' | 'female'
let state = 'menu';          // menu | playing | over
let playMode = 'solo';       // 'solo' 单人 | 'duo' 本地双人合作
let overInfo = null;

/* ---------------- 双模式配置 ---------------- */
const MODES = {
  male: {
    label: '硬核',
    bg: '#050a14', grid: 'rgba(0,229,255,0.10)', watermark: '#00e5ff',
    player: '#00e5ff', playerDark: '#0088aa', bullet: '#00e5ff',
    enemy: '#ff5b2e', boss: '#ff2e88', boss2: '#a74fff',
    armor: '#9b59b6', fast: '#ffd54a',
    speedScale: 1, enemyFire: 1.25, playerCd: 430,
    weapon: '重型坦克', theme: 'hardcore',
  },
  female: {
    label: '舒缓',
    bg: '#120b26', grid: 'rgba(255,143,214,0.10)', watermark: '#ff8fd6',
    player: '#ff8fd6', playerDark: '#ff4fae', bullet: '#ffc6ef',
    enemy: '#ffb26b', boss: '#c8a2ff', boss2: '#e8b7ff',
    armor: '#e0a0ff', fast: '#ffd9a0',
    speedScale: 0.72, enemyFire: 0.55, playerCd: 520,
    weapon: '魔法球', theme: 'cozy',
  },
};

/* ---------------- 操作（P1 = WASD+空格，P2 = 方向键+回车） ---------------- */
const input = {
  p1: { up:false, down:false, left:false, right:false, fire:false },
  p2: { up:false, down:false, left:false, right:false, fire:false },
};
const KEY_P1 = { w:'up', s:'down', a:'left', d:'right', ' ':'fire' };
const KEY_P2 = { arrowup:'up', arrowdown:'down', arrowleft:'left', arrowright:'right', enter:'fire' };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEY_P1[k] !== undefined) input.p1[KEY_P1[k]] = true;
  if (KEY_P2[k] !== undefined) input.p2[KEY_P2[k]] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (KEY_P1[k] !== undefined) input.p1[KEY_P1[k]] = false;
  if (KEY_P2[k] !== undefined) input.p2[KEY_P2[k]] = false;
});
function clearInput(){ input.p1.up=input.p1.down=input.p1.left=input.p1.right=input.p1.fire=false;
  input.p2.up=input.p2.down=input.p2.left=input.p2.right=input.p2.fire=false; }

/* ---------------- FJQ 地图生成 ---------------- */
// 0=空 1=砖墙(可破坏) 2=钢墙(不可破坏)
const FJQ_LETTERS = {
  F: ['###','#..','##.','#..','#..'],
  J: ['###','..x','..x','..x','##.'].map(s=>s.replace(/x/g,'#')),
  // Q 加宽到 4 列、加高到 6 行：闭合方环 + 明显右下尾巴 → 一眼可辨的 Q，不再与 O/椭圆混淆
  Q: [
    '###.',
    '#..#',
    '#..#',
    '#..#',
    '####',
    '...#',
  ],

var grid;
function buildMap() {
  const g = Array.from({length:ROWS}, () => new Array(COLS).fill(0));
  const R = (r,c)=> g[r][c];
  const set = (r,c,v)=>{ if(r>=0&&r<ROWS&&c>=0&&c<COLS) g[r][c]=v; };

  // —— 中央拼出 F J Q（钢墙，作为永久主题）——（上方一排，给中央底图留白）
  const positions = [
    { L:'F', row:1, col:1 },
    { L:'J', row:1, col:5 },
    { L:'Q', row:1, col:9 },
  ];
  positions.forEach(p => {
    const pat = FJQ_LETTERS[p.L];
    for (let r=0; r<pat.length; r++)
      for (let c=0; c<pat[r].length; c++)
        if (pat[r][c]==='#') set(p.row+r, p.col+c, 2);
  });

  // —— 四周加砖墙掩体 ——
  // 顶部两角 + 左右中部 + 底部两角
  const clusters = [
    [1,1,2,2],[1,COLS-3,2,2],           // 顶部角
    [5,1,3,1],[6,COLS-2,3,1],           // 左右侧
    [10,1,2,3],[10,COLS-4,2,3],         // 底部角
  ];
  clusters.forEach(([r,c,h,w]) => {
    for(let rr=r; rr<r+h; rr++) for(let cc=c; cc<c+w; cc++) if(R(rr,cc)===0) set(rr,cc,1);
  });
  return g;
}

function cellSolid(r,c) {
  if (r<0||c<0||r>=ROWS||c>=COLS) return true;           // 越界视为墙
  return grid[r][c] === 1 || grid[r][c] === 2;
}

/* ---------------- WebAudio 音频系统 ---------------- */
let actx = null, bgmTimer = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur);
}
function noise(dur, vol, freq) {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const len = Math.floor(a.sampleRate*dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t);
}

// —— 鼓组合成 ——
function noiseFilt(dur, vol, type, freq) {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const len = Math.floor(a.sampleRate*dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = type||'lowpass'; f.frequency.value = freq;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
}
function kick()      { tone(126, 0.16, 'sine', 0.5, 46); }
function snare()     { noiseFilt(0.12, 0.3,  'lowpass', 1800); tone(190,0.07,'triangle',0.10,120); }
function snareSoft() { noiseFilt(0.14, 0.16, 'bandpass', 1300); tone(200,0.08,'triangle',0.06,150); }
function hihat(open) { noiseFilt(open?0.12:0.045, open?0.10:0.09, 'highpass', 7500); }

// —— 背景音乐 ——
// 男生 = Drum&Bass（~170BPM 高能鼓点）／ 女生 = Lo-fi 舒缓慢节拍
const BASS_DNB = [55,55,82.41,82.41,73.42,73.42,98,98];
const LEAD_DNB = [220,261.63,329.63,392,329.63,440,392,523.25];
const CHORD_LOFI = [196,220,261.63,392];
const MEL_LOFI = [523.25,659.25,587.33,698.46,880,698.46,587.33,659.25];
function bgmDnb(st){
  const acc = st%16;
  if (acc===0||acc===8) kick();
  else if (acc===4||acc===12) snare();
  hihat(false); if (acc%4===2) hihat(true);
  if (acc%2===0) tone(BASS_DNB[Math.floor(acc/2)%BASS_DNB.length], 0.17, 'sawtooth', 0.085);
  if (acc===0||acc===6||acc===8||acc===12||acc===14) tone(LEAD_DNB[Math.floor(acc/2)%LEAD_DNB.length], 0.12, 'square', 0.05);
}
function bgmLofi(st){
  const acc = st%8;
  if (acc===0) kick();
  if (acc===4) snareSoft();
  if (acc===2||acc===6) hihat(false);
  if (acc===0||acc===4) tone(CHORD_LOFI[Math.floor(st/8)%CHORD_LOFI.length], 0.7, 'triangle', 0.08);
  tone(MEL_LOFI[acc], 0.2, 'square', 0.05);
}
function startBgm() {
  stopBgm();
  const hc = MODES[mode].theme==='hardcore';
  let step = 0;
  bgmTimer = setInterval(() => {
    if (hc) bgmDnb(step); else bgmLofi(step);
    step++;
  }, hc? 90 : 240);
}
function stopBgm() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer=null; } }

let menuTimer = null;
function menuMusic(st){
  const hc = MODES[mode].theme==='hardcore';
  if (hc) {
    // 硬核：低沉律动贝斯 + 琶音，明显可听
    const bass=[55,55,65.41,49,55,65.41,58.27,65.41];
    tone(bass[st%bass.length], 0.6, 'sawtooth', 0.12, bass[st%bass.length]*0.985);
    tone(220+[0,57.18,109.63,57.18][st%4], 0.35, 'triangle', 0.07);
    if(st%2===0) kick();
  } else {
    // 萌系：柔和高音和弦铺底
    const seq=[392,440,523.25,659.25,523.25,440];
    tone(seq[st%seq.length], 0.8, 'sine', 0.12);
    tone(130.81+[0,16.35,0,-16.35][st%4], 0.8, 'triangle', 0.08);
    if(st%4===2) tone(1568,0.12,'sine',0.06);
  }
}
function startMenuBgm(){
  stopMenuBgm(); stopBgm();  // 菜单音乐启动时强制关闭战斗 BGM，保证二者绝不重合
  let step = 0;
  menuTimer = setInterval(() => {
    menuMusic(step);
    step++;
  }, MODES[mode].theme==='hardcore' ? 260 : 380);
}
function stopMenuBgm(){ if (menuTimer) { clearInterval(menuTimer); menuTimer=null; } }

// —— 情感语音系统（有感情）——
// 优先使用系统语音，并按性别调节音高/语速营造低沉男音 / 清亮女音；
// 若系统没有任何中文语音或合成失败，则自动在线下载 TTS 音频播放。
let _ttsFalling=false;
function pickSysVoice(tone){
  if (!('speechSynthesis' in window)) return null;
  const vs = window.speechSynthesis.getVoices();
  const isZh = v => (v.lang||'').toLowerCase().startsWith('zh');
  const zh = vs.filter(isZh);
  if (!zh.length) return null;                              // 无中文语音 → 交给在线下载
  if (tone === 'female') {
    return zh.find(v=>/yao|huihui|ting|female|xiao|mei|tingting|nana|tinghua|tingting/i.test(v.name)) || zh[0];
  }
  if (tone === 'male') {
    // 优先真正男声（含常见男声名）；找不到男声时退回中文语音，靠低音高+慢语速强化成男声
    return zh.find(v=>/kangkang|yunjian|yunxi|yunyang|yichong|yunfeng|kang|male|eason/i.test(v.name)) || zh[0];
  }
  return zh[0];
}
function isMaleVoiceName(name){ return /kangkang|yunjian|yunxi|yunyang|yichong|yunfeng|kang|yunboy|male|eason/i.test(name); }
function speakText(text, tone){
  _ttsFalling=false;
  if (!('speechSynthesis' in window)) { speakDownload(text, tone); return; }
  try {
    window.speechSynthesis.cancel();
    const v = pickSysVoice(tone);
    if (tone==='male') {
      // 男生模式强求真男声：系统只有女声或无中文语音时，改用在线男声
      if (!v || !isMaleVoiceName(v.name)) { speakDownload(text,'male'); return; }
    } else if (tone==='female') {
      if (!v) { speakDownload(text,'female'); return; }   // 无中文语音 → 在线女声
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.volume=1;
    if (v) u.voice=v;
    if (tone==='female')   { u.pitch=1.35; u.rate=1.0; }        // 真女声：轻微清亮
    else if (tone==='male'){ u.pitch=0.40; u.rate=0.78; }        // 真男声：低沉浑厚
    else                   { u.pitch=1.0;  u.rate=0.95; }
    u.onerror=()=>{ if(!_ttsFalling){ _ttsFalling=true; speakDownload(text, tone); } };
    window.speechSynthesis.speak(u);
  } catch (e) { speakDownload(text, tone); }
}
// 在线 TTS 下载播放：优先百度翻译语音（可达性最好），失败自动切换下一源。
// 男声通过降低播放速率（playbackRate<1）得到低沉音色；女声保持标准速率。
function speakDownload(text, tone){
  const q = encodeURIComponent(text);
  const urls = [
    'https://fanyi.baidu.com/gettts?lan=zh&text='+q+'&spd=3&source=web',
    'https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-CN&total=1&idx=0&client=tw-ob&q='+q,
  ];
  playTts(urls, tone==='male');
}
function playTts(urls, male){
  if(!urls.length) return;
  const au = new Audio();
  const fail = ()=>{ try{ au.pause(); au.removeAttribute('src'); au.load(); }catch(e){} playTts(urls.slice(1), male); };
  au.addEventListener('error', fail, {once:true});
  au.addEventListener('stalled', fail, {once:true});
  au.src=urls[0]; au.preload='auto';
  au.playbackRate = male?0.72:1.0;   // 男声：放慢 → 音调低沉浑厚
  au.volume=1;
  au.play().catch(fail);
}

/* ---------------- 道具 / 粒子 ---------------- */
const particles = [];
function burst(x, y, color, n, spread, speed, life) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, sp = speed*(0.4+Math.random()*0.8);
    particles.push({ x, y, vx:Math.cos(a)*sp*(spread||1), vy:Math.sin(a)*sp*(spread||1),
      color, life:(life||0.5)*(0.6+Math.random()*0.7), max:life||0.5, r:1+Math.random()*2.4 });
  }
}

/* ---------------- 全局游戏对象 ---------------- */
let game = null;

class Bullet {
  constructor(x,y,dx,dy,speed,color,power,owner,size){
    this.x=x; this.y=y; this.vx=dx*speed; this.vy=dy*speed;
    this.color=color; this.power=power||1; this.owner=owner;
    this.r=size||4; this.dead=false;
  }
  update(dt){
    this.x += this.vx*dt; this.y += this.vy*dt;
    if (this.x<-20||this.x>W+20||this.y<-20||this.y>H+20) { this.dead=true; return; }
    // 撞墙
    const c=Math.floor(this.x/CELL), r=Math.floor((this.y-HUD_H)/CELL);
    if (c>=0&&c<COLS&&r>=0&&r<ROWS) {
      const v=grid[r][c];
      if (v===1) { grid[r][c]=0; this.dead=true; burst(this.x,this.y,MODES[mode].enemy,10,1,140,0.4); sfxExplosion(false); return; }
      if (v===2) { this.dead=true; burst(this.x,this.y,'#b7c7df',8,1,120,0.3); return; }
    }
  }
  draw(){
    ctx.globalAlpha=0.35; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,7); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.5,0,7); ctx.fill();
  }
}

function playerColor(idx){
  if (idx===0) return MODES[mode].player;
  return mode==='male' ? '#ff2e88' : '#00e5ff';
}
class Player {
  constructor(x, y, ctrlTag, index){
    this.r=15; this.x=x; this.y=y; this.ctrl=input[ctrlTag]; this.index=index;
    this.color=playerColor(index);
    this.dir='up'; this.hp=3; this.maxHp=5; this.level=1; this.cool=0; this.invul=0; this.alive=true;
    this.speed=110*MODES[mode].speedScale;
    this.shield=false; this.rapidT=0; this.spreadT=0; this.doubleT=0;
  }
  update(dt){
    if(!this.alive) return;
    this.cool-=dt; this.invul-=dt;
    if (this.rapidT>0) this.rapidT-=dt;
    if (this.spreadT>0) this.spreadT-=dt;
    if (this.doubleT>0) this.doubleT-=dt;
    const k=this.ctrl;
    let dx=0, dy=0;
    if (k.left) dx=-1; if (k.right) dx=1;
    if (k.up) dy=-1; if (k.down) dy=1;
    if (dx&&dy) { dx*=0.707; dy*=0.707; }
    if (dx) this.dir = dx>0?'right':'left';
    if (dy) this.dir = dy>0?'down':'up';
    if (dx||dy) this.tryMove(dx*this.speed*dt, dy*this.speed*dt);
    if (k.fire && this.cool<=0) this.fire();
  }
  tryMove(dx,dy){
    let nx=this.x+dx, ny=this.y+dy;
    if (nx<this.r||nx>W-this.r||ny<HUD_H+this.r||ny>H-this.r) return;
    const half=this.r-4;
    const x1=Math.floor((nx-half)/CELL), x2=Math.floor((nx+half)/CELL);
    const y1=Math.floor((ny-half-HUD_H)/CELL), y2=Math.floor((ny+half-HUD_H)/CELL);
    for(let r=y1;r<=y2;r++) for(let c=x1;c<=x2;c++) if(cellSolid(r,c)) return;
    this.x=nx; this.y=ny;
  }
  fire(){
    const m=MODES[mode];
    // 单位统一为秒：基础冷却 - 等级加速 - 速射装备加速
    this.cool = (m.playerCd - Math.min(180,(this.level-1)*50) - (this.rapidT>0?130:0)) / 1000;
    const power = this.level;
    const VEC={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    const d=VEC[this.dir];
    if ((this.level>=3||this.spreadT>0) && m.theme!=='cozy') {
      // 男生3级：三连散射
      burst(this.x,this.y, this.color,6,1,130,0.25);
      [-18,0,18].forEach(ang=>{
        const a=facing(this.dir)+ang*Math.PI/180;
        game.addBullet(this.x+Math.cos(a)*18, this.y+Math.sin(a)*18, Math.cos(a), Math.sin(a), 340, this.color, power, 'player');
      });
    } else if ((this.level>=2||this.doubleT>0) && m.theme==='cozy') {
      // 女生2级：魔法双球
      game.addBullet(this.x+d[0]*15+5, this.y+d[1]*15+5, d[0], d[1], 300, this.color, power, 'player', 5);
      game.addBullet(this.x-d[0]*6, this.y-d[1]*6, d[0], d[1], 300, this.color, power, 'player', 5);
    } else {
      const a=facing(this.dir);
      game.addBullet(this.x+Math.cos(a)*18, this.y+Math.sin(a)*18, Math.cos(a), Math.sin(a), 340, this.color, power, 'player');
    }
    sfxShoot();
  }
  damage(){
    if (this.invul>0) return;
    if (this.shield) {
      this.shield=false; this.invul=1.0;
      sfxHit(); burst(this.x,this.y,'#66ccff',16,1,170,0.5); showMsg('护盾抵挡了伤害！');
      return;
    }
    this.invul=1.2; this.hp--;
    sfxHit();
    if (this.hp<=0) {
      this.hp=0; this.alive=false;
      burst(this.x,this.y,this.color,22,1,200,0.7); sfxExplosion(false);
      if (game) game.checkPlayers();
    }
  }
  draw(){
    const m=MODES[mode];
    if (this.invul>0 && Math.floor(this.invul*12)%2===0) return;
    ctx.save(); ctx.translate(this.x,this.y);
    if (m.theme==='hardcore') drawTankHardcore(m, this.color); else drawTankCozy(m, this.color);
    if (this.shield){
      ctx.strokeStyle='rgba(102,204,255,0.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,this.r+5,0,7); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0,this.r+9,0,7); ctx.stroke();
    }
    ctx.restore();
  }
}
function facing(d){
  switch(d){
    case 'up': return -Math.PI/2;
    case 'down': return Math.PI/2;
    case 'left': return Math.PI;
    default: return 0; // right
  }
}

// —— 男生硬核坦克（棱角方块 + 履带）——
function drawTankHardcore(m, c){
  c = c || m.player;
  ctx.shadowColor=c; ctx.shadowBlur=14;
  ctx.fillStyle=m.playerDark; ctx.fillRect(-15,-15,30,30);
  ctx.shadowBlur=0;
  ctx.fillStyle=c; ctx.fillRect(-15,-15,30,30);
  ctx.fillRect(-13,-15,6,30); ctx.fillRect(7,-15,6,30);      // 履带
  ctx.fillStyle='#000'; ctx.fillRect(-9,-8,18,16);           // 座舱
  ctx.fillStyle=c; ctx.fillRect(-4,-4,8,8);
  ctx.strokeStyle='#052'; ctx.lineWidth=3; ctx.strokeRect(-15,-15,30,30);
}
// —— 女生Q版坦克（圆润 + 魔法球）——
function drawTankCozy(m, c){
  c = c || m.player;
  ctx.shadowColor='#ffee'; ctx.shadowBlur=16;
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,15,0,7); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle=m.playerDark; ctx.beginPath(); ctx.arc(0,0,15,0,7); ctx.fill();
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.fill();
  ctx.fillStyle='#ffb6e9'; ctx.beginPath(); ctx.arc(3,-3,2.4,0,7); ctx.fill(); // 高光
}
// 炮管单独绘制（叠加在坦克上，随方向旋转）
function drawTurret(p, color){
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(facing(p.dir)+Math.PI/2);
  ctx.shadowColor=color; ctx.shadowBlur=10;
  ctx.fillStyle=color; ctx.fillRect(-2.5,-20,5,22);
  ctx.shadowBlur=0;
  ctx.restore();
}

/* ---------------- 敌人 ---------------- */
class Enemy {
  constructor(kind, x, y){
    this.kind=kind; this.x=x; this.y=y;
    const m=MODES[mode];
    const cfg = kind==='fast' ? {hp:1,r:13} : kind==='armor' ? {hp:3,r:18} : {hp:1,r:16};
    this.hp=cfg.hp; this.r=cfg.r;
    this.color = kind==='fast'?m.fast : kind==='armor'?m.armor : m.enemy;
    this.speed = (kind==='fast'?115: kind==='armor'?42: 66)*m.speedScale;
    this.dir = (Math.random()<0.5?'L':'R');
    this.cool = 1+Math.random()*2;
    this.fireCd = 0.9+Math.random()*1.5;
    this.dead=false; this.stuck=0;
    // 头顶标签（按性别，轮换随机贴一个）
    const tags = ENEMY_TAGS[mode==='female' ? 'female' : 'male'];
    this.tag = tags[Math.floor(Math.random()*tags.length)];
  }
  update(dt){
    this.cool-=dt; this.fireCd-=dt;
    // 移动（沿网格行进，撞墙转向）
    let dx=0,dy=0;
    if (this.dir==='L') dx=-1; else if (this.dir==='R') dx=1;
    else if (this.dir==='U') dy=-1; else dy=1;
    let nx=this.x+dx*this.speed*dt, ny=this.y+dy*this.speed*dt;
    if (!this.canStand(nx,ny)) {
      this.stuck+=dt;
      if (this.stuck>0.28) { this.pickDir(); this.stuck=0; }
    } else { this.x=nx; this.y=ny; this.stuck=0; }
    // 开火（有概率朝玩家）
    if (this.fireCd<=0 && Math.abs(this.y-(H-HUD_H-34)) < 300) {
      this.fireCd = (0.9+Math.random()*1.4) * (1/MODES[mode].enemyFire);
      if (Math.random()<0.75 && game) {
        const t=game.nearestPlayer(this.x,this.y);
        const a=Math.atan2(t.y-this.y, t.x-this.x);
        game.enemyFire(this.x,this.y,Math.cos(a),Math.sin(a),this.color);
      } else {
        const map={L:Math.PI,R:0,U:-Math.PI/2,D:Math.PI/2}[this.dir];
        game.enemyFire(this.x,this.y,Math.cos(map),Math.sin(map),this.color);
      }
    }
  }
  canStand(nx,ny){
    if (nx<12||nx>W-12||ny<HUD_H+12||ny>H-12) { this.dir=this.dir==='L'?'R':this.dir==='R'?'L':this.dir==='U'?'D':'U'; return false; }
    const half=this.r-4;
    const x1=Math.floor((nx-half)/CELL), x2=Math.floor((nx+half)/CELL);
    const y1=Math.floor((ny-half-HUD_H)/CELL), y2=Math.floor((ny+half-HUD_H)/CELL);
    for(let r=y1;r<=y2;r++) for(let c=x1;c<=x2;c++) if(cellSolid(r,c)) return false;
    return true;
  }
  pickDir(){
    const opts=['L','R','U','D'];
    // 贴合网格选一个可行的方向
    let tries=0;
    while(tries++<8){
      const d=opts[Math.floor(Math.random()*4)];
      let dx=0,dy=0; if(d==='L')dx=-1;else if(d==='R')dx=1;else if(d==='U')dy=-1;else dy=1;
      if (this.canStand(this.x+48*dx, this.y+48*dy)) { this.dir=d; return; }
    }
  }
  draw(){
    ctx.globalAlpha=0.9;
    ctx.shadowColor=this.color; ctx.shadowBlur=10;
    ctx.fillStyle=this.color; ctx.fillRect(this.x-this.r,this.y-this.r,this.r*2,this.r*2);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(this.x-this.r+4,this.y-this.r+4,this.r*2-8,this.r*2-8);
    // 方向指示
    ctx.fillStyle='#fff';
    const map={L:-1,R:1,U:0,D:0}, mapy={L:0,R:0,U:-1,D:1};
    ctx.fillRect(this.x+map[this.dir]*this.r+map[this.dir]*2-2, this.y+mapy[this.dir]*this.r+mapy[this.dir]*2-2, 4,4);
    ctx.globalAlpha=1;
    // 头顶标签气泡
    ctx.font='10px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    const tw=ctx.measureText(this.tag).width+8;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(this.x-tw/2,this.y-this.r-16,tw,14);
    ctx.strokeStyle=this.color; ctx.lineWidth=1; ctx.strokeRect(this.x-tw/2,this.y-this.r-16,tw,14);
    ctx.fillStyle='#fff'; ctx.fillText(this.tag,this.x,this.y-this.r-6);
    ctx.textAlign='left';
  }
}

const BOSS_WIN_LINES = ['我的错','我认栽','听你的','我闭嘴','算我没说','甘拜下风','大佬请喝茶','惹不起'];
let bossWinIdx = 0;
class Boss {

    this.name=this.tpl.name;
    this.x=W/2; this.y=HUD_H+60; this.r=this.tpl.r;
    this.colors = { boss:this.tpl.color, core:this.tpl.core };
    this.hp = this.tpl.hp * (m.theme==='hardcore'? 1.0 : 0.65);
    this.maxHp=this.hp;
    this.fireCd=this.tpl.fireCd; this.t=0; this.phase=1; this.dead=false;
    this.taunts = BOSS_TAUNTS[m.theme==='hardcore' ? 'male' : 'female'];
    this.tauntIdx=0; this.tauntTimer=1.2; this.curTaunt=this.taunts[0];
    showMsg(this.curTaunt);                 // 登场即嘲讽
  }
  update(dt){
    // 缓慢左右移动
    this.x += Math.sin(this.t*0.5)*40*dt;
    this.x=Math.max(50,Math.min(W-50,this.x));
    this.t+=dt;
    // 周期性轮换嘲讽，刺激玩家挑战
    this.tauntTimer-=dt;
    if(this.tauntTimer<=0 && game){
      this.tauntTimer = mode==='male'? 4.2 : 3.6;
      this.tauntIdx=(this.tauntIdx+1)%this.taunts.length;
      this.curTaunt=this.taunts[this.tauntIdx];
      showMsg(this.curTaunt);
    }
    this.fireCd-=dt;
    if (this.fireCd<=0 && game) {
      this.fireCd = this.tpl.fireCd*0.9 + Math.random()*0.2;
      const tgt=game.nearestPlayer(this.x,this.y);
      const base=Math.atan2(tgt.y-this.y, tgt.x-this.x);
      const nOff=this.tpl.volley + this.phase;            // 阶段越高弹幕越密
      for(let i=0;i<nOff;i++){
        const a=base + (i-(nOff-1)/2)*this.tpl.spread;
        game.enemyFire(this.x,this.y,Math.cos(a),Math.sin(a), MODES[mode].boss2, 250, 2);
      }
    }
    const frac=this.hp/this.maxHp;
    this.phase = frac<0.34?3 : frac<0.67?2 : 1;
  }
  draw(){
    const m=MODES[mode];
    ctx.save(); ctx.translate(this.x,this.y);
    ctx.shadowColor=this.colors.boss; ctx.shadowBlur=24;
    ctx.fillStyle=this.colors.boss;
    ctx.beginPath(); if(m.theme==='hardcore'){ctx.rect(-this.r,-this.r,this.r*2,this.r*2);} else {ctx.arc(0,0,this.r,0,7);}
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,this.r*0.4,0,7); ctx.fill();
    ctx.fillStyle=this.colors.core; ctx.beginPath(); ctx.arc(0,0,this.r*0.22,0,7); ctx.fill();
    const nPort=2+this.phase;
    for(let i=0;i<nPort;i++){
      const a=this.t*2+i*(Math.PI*2/nPort);
      ctx.fillStyle=this.colors.core; ctx.beginPath(); ctx.arc(Math.cos(a)*this.r,Math.sin(a)*this.r,6,0,7); ctx.fill();
    }
    ctx.restore();
    // 血条
    const bw=this.r*2.4, bx=this.x-bw/2;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx,this.y-this.r-12,bw,7);
    const grd=ctx.createLinearGradient(bx,0,bx+bw,0);
    grd.addColorStop(0,'#ff2e88'); grd.addColorStop(1,'#ffd54a');
    ctx.fillStyle=grd; ctx.fillRect(bx,this.y-this.r-12,bw*Math.max(0,this.hp/this.maxHp),7);
    // 头顶：Boss 名字 + 嘲讽气泡
    ctx.textAlign='center';
    ctx.font='bold 13px "Microsoft YaHei",sans-serif';
    ctx.lineWidth=3; ctx.strokeStyle='#000';
    ctx.strokeText(this.name, this.x, this.y-this.r-38);
    ctx.fillStyle=this.colors.core; ctx.fillText(this.name, this.x, this.y-this.r-38);
    ctx.font='11px "Microsoft YaHei",sans-serif';
    const tw=ctx.measureText(this.curTaunt).width+16, by=this.y-this.r-58;
    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(this.x-tw/2, by-13, tw, 20);
    ctx.strokeStyle=this.colors.core; ctx.lineWidth=1; ctx.strokeRect(this.x-tw/2, by-13, tw, 20);
    ctx.fillStyle='#ffe9a8'; ctx.fillText(this.curTaunt, this.x, by+1);
    ctx.textAlign='left';
  }
}

/* ---------------- 游戏主控 ---------------- */
function initPlayers(){
  const y = H-HUD_H-34;
  const arr = [ new Player(W*0.5, y, 'p1', 0) ];
  if (playMode==='duo') arr.push(new Player(W*0.72, y, 'p2', 1));
  return arr;
}
class Game {
  constructor(){
    this.grid=grid; this.players=initPlayers();
    this.enemies=[]; this.boss=null; this.bullets=[]; this.pickups=[];
    this.score=0; this.kills=0; this.spawnTimer=1.5; this.time=0;
    this.maxEnemy = mode==='male'? 5 : 4;
    this.bossAt = 8; this.nextBossAt=this.bossAt;
  }
  nearestPlayer(x,y){
    let best=this.players[0], bd=1e9;
    for(const p of this.players){ if(!p.alive) continue; const d=dist(x,y,p.x,p.y); if(d<bd){bd=d;best=p;} }
    return best;
  }
  checkPlayers(){
    if (!this.players.some(p=>p.alive)) endGame();
  }
  addBullet(x,y,dx,dy,speed,color,power,owner,size){ this.bullets.push(new Bullet(x,y,dx,dy,speed,color,power,owner,size)); }
  enemyFire(x,y,dx,dy,color,speed,power){ this.addBullet(x,y,dx,dy,speed||260,color,power||1,'enemy',4); }

  spawnEnemy(){
    const x = [W*0.15,W*0.5,W*0.85][Math.floor(Math.random()*3)];
    const kind = Math.random()<0.12&&this.kills>6 ? 'armor' : Math.random()<0.15&&this.kills>3 ? 'fast' : 'normal';
    const e = new Enemy(kind, Math.max(20,Math.min(W-20,x)), HUD_H+24);
    this.enemies.push(e); burst(e.x,e.y,MODES[mode].enemy,10,1,140,0.4);
  }

  update(dt){
    this.time+=dt;
    for(const p of this.players) p.update(dt);

    // 敌人生成
    this.spawnTimer-=dt;
    if (this.spawnTimer<=0 && this.enemies.length<this.maxEnemy) {
      this.spawnTimer = mode==='male'? (1.6-Math.min(0.9,this.kills*0.004)) : (2.4-Math.min(1.2,this.kills*0.004));
      this.spawnEnemy();
    }

    // Boss 触发
    if (this.kills>=this.nextBossAt && !this.boss) {
      this.boss=new Boss(pickBossType(this.kills)); sfxBossAlert(); showMsg(this.boss.name+' 入侵！');
    }

    // 敌人
    for(const e of this.enemies){ e.update(dt); }
    this.enemies=this.enemies.filter(e=>!e.dead);

    if (this.boss && !this.boss.dead) this.boss.update(dt);

    // 子弹
    for(const b of this.bullets){ b.update(dt); }

    // 碰撞
    this.collide();
    this.updatePickups(dt);

    // 粒子
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life-=dt; }
    for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);

    this.bullets=this.bullets.filter(b=>!b.dead);
    updateHud();
  }

  collide(){
    // 玩家子弹 vs 敌人 / boss
    for(const b of this.bullets){
      if(b.owner!=='player') continue;
      for(const e of this.enemies){
        if(e.dead) continue;
        if(dist(b.x,b.y,e.x,e.y)<e.r+b.r){ b.dead=true; this.hurtEnemy(e,b.power); break; }
      }
      if(b.dead) continue;
      if(this.boss && !this.boss.dead && dist(b.x,b.y,this.boss.x,this.boss.y)<this.boss.r+b.r){
        b.dead=true; this.boss.hp-=b.power; burst(b.x,b.y,MODES[mode].boss,8,1,160,0.4);
        if(this.boss.hp<=0){ this.boss.dead=true; onBossDie(); }
        else sfxHit();
      }
    }
    // 敌弹 vs 各玩家
    for(const b of this.bullets){
      if(b.owner!=='enemy') continue;
      for(const p of this.players){
        if(!p.alive || p.invul>0) continue;
        if(dist(b.x,b.y,p.x,p.y)<p.r+b.r){ b.dead=true; p.damage(); break; }
      }
    }
  }
  hurtEnemy(e,power){
    e.hp-=power; burst(e.x,e.y,e.color,6,1,120,0.3);
    if(e.hp<=0){ e.dead=true; this.kills++; this.score+= e.kind==='armor'?25:e.kind==='fast'?12:10; this.checkPromotion(); sfxExplosion(false); burst(e.x,e.y,e.color,20,1,180,0.5);
      if (Math.random()<0.4) this.dropPickup(e.x,e.y);
      // 升级检测
      if(this.kills%5===0) this.levelUp();
    } else sfxHit();
  }
  levelUp(){
    for(const p of this.players) if(p.alive) p.level=Math.min(3,p.level+1);
    sfxUpgrade(); flash(); showMsg('POWER UP · 全部坦克 LV 提升');
  }
  checkPromotion(){
    const newR=rankFor(this.kills);
    if(this.rankName && this.rankName!==newR.name) promote(newR);  // 跨段位 → 升段成就感
    this.rankName=newR.name;
  }
  dropPickup(x,y){
    if (this.pickups.length>=6) return;
    const kind = EQUIP_ORDER[Math.floor(Math.random()*EQUIP_ORDER.length)];
    this.pickups.push({x,y,kind,life:12,dead:false});
  }
  applyPickup(kind, who){
    const p = who, m=MODES[mode];
    const cfg=EQUIPS[kind];
    sfxPickup();
    if(kind==='hp')      p.hp = Math.min(p.maxHp, p.hp+1);
    else if(kind==='shield') p.shield = true;
    else if(kind==='rapid')  p.rapidT = 7;
    else if(kind==='spread'){ m.theme==='cozy' ? p.doubleT=7 : p.spreadT=7; }
    else if(kind==='double') p.doubleT = 7;
    flash(); burst(p.x,p.y,cfg.color,18,1,170,0.5);
    showMsg('获得装备 · '+cfg.name);
  }
  updatePickups(dt){
    for(const pk of this.pickups) pk.life-=dt;
    this.pickups=this.pickups.filter(pk=>pk.life>0);
    for(const p of this.players){
      if(!p.alive) continue;
      for(const pk of this.pickups){
        if (dist(pk.x,pk.y,p.x,p.y) < p.r+15) { pk.dead=true; this.applyPickup(pk.kind,p); }
      }
    }
    this.pickups=this.pickups.filter(pk=>!pk.dead);
  }
  draw(){
    drawBG();
    // 静态 FJQ
    drawWalls();
    for(const e of this.enemies){ e.draw(); }
    if(this.boss && !this.boss.dead) this.boss.draw();
    for(const p of this.players){ drawTurret(p, p.color); p.draw(); }
    for(const b of this.bullets) b.draw();
    // 装备掉落
    ctx.textAlign='center';
    for(const pk of this.pickups){
      const c=EQUIPS[pk.kind].color;
      ctx.shadowColor=c; ctx.shadowBlur=14;
      ctx.fillStyle=c;
      ctx.save(); ctx.translate(pk.x,pk.y); ctx.rotate(Math.sin(this.time*3)*0.35);
      ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(10,0); ctx.lineTo(0,10); ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.shadowBlur=0;
      ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.fillText(EQUIPS[pk.kind].name,pk.x,pk.y+22);
    }
    ctx.textAlign='left';
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
  }
}

function onBossDie(){
  sfxBossDie(); flash(); 
  game.score+=100; game.kills++; 
  // 打爆大 Boss 后：Boss “服软”恭维话术（按顺序轮换，刺激玩家持续挑战）
  const line = BOSS_WIN_LINES[bossWinIdx++ % BOSS_WIN_LINES.length];
  showMsg('💥 BOSS 讨伐成功！ 「'+line+'」');
  game.boss=null; game.nextBossAt = game.kills + game.bossAt;
}

/* ---------------- 绘制 ---------------- */
function drawBG(){
  const m=MODES[mode];
  if(m.theme==='hardcore') drawCyberBG(m); else drawGardenBG(m);
  // 浅网格便于定位
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=CELL){ ctx.beginPath(); ctx.moveTo(x,HUD_H); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=HUD_H;y<=H;y+=CELL){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // —— 地图中央的社区底图（缩小居中，带霓虹展示框）——
  if (bgImg && bgImg.complete && bgImg.width) {
    const tw = W*0.34, th = tw * bgImg.height / bgImg.width;
    const cx = W/2, cy = HUD_H + 6.4*CELL;
    const bx = cx - tw/2 - 7, by = cy - th/2 - 7;
    ctx.save();
    ctx.fillStyle='rgba(2,6,14,0.55)';
    ctx.fillRect(bx,by,tw+14,th+14);
    ctx.strokeStyle='rgba(0,229,255,0.85)'; ctx.lineWidth=2;
    ctx.shadowColor='#0cf'; ctx.shadowBlur=18;
    ctx.strokeRect(bx,by,tw+14,th+14);
    ctx.shadowBlur=0;
    ctx.drawImage(bgImg, cx-tw/2, cy-th/2, tw, th);
    // 顶部品牌小字
    ctx.fillStyle='rgba(0,229,255,0.7)'; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText('WAVEPEAK COMMUNITY', cx, by-6);
    ctx.restore();
  }
  drawHudBar(m);
}
// —— 男生：赛博朋克都市夜景 ——
function drawCyberBG(m){
  const t=Date.now()/1000, g=ctx;
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a1430'); sky.addColorStop(0.55,'#070c1c'); sky.addColorStop(1,'#02030a');
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // 星星
  for(let i=0;i<55;i++){
    const x=(i*97)%W, y=(i*53)%(H-HUD_H)+HUD_H;
    g.globalAlpha=0.2+0.45*Math.sin(t*2+i);
    g.fillStyle='#bcd8ff'; g.fillRect(x,y,2,2);
  }
  g.globalAlpha=1;
  // 无人机 / 悬浮车光轨
  for(let s=0;s<3;s++){
    const sp=42+s*22, off=s*160, x=((t*sp+off)%(W+320))-160, y=HUD_H+34+s*52;
    const grd=g.createLinearGradient(x-95,0,x+20,0);
    grd.addColorStop(0,'rgba(0,229,255,0)'); grd.addColorStop(1,'rgba(0,229,255,0.55)');
    g.strokeStyle=grd; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x-95,y); g.lineTo(x,y); g.stroke();
    g.fillStyle='#dffaff'; g.fillRect(x,y-1,5,3);
  }
  // 城市天际线（蓝紫霓虹）
  const nB=9, baseBottom=H+14;
  for(let i=0;i<nB;i++){
    const s=Math.sin(i*127.3)*43758.5, r=s-Math.floor(s);
    const bw=34+r*44, bx=i*bw, bh=60+r*160, top=H-bh;
    g.fillStyle='rgba(6,11,28,0.94)';
    g.fillRect(bx,top,bw,bh);
    g.strokeStyle = i%2? 'rgba(0,229,255,0.55)':'rgba(255,46,136,0.55)';
    g.lineWidth=1; g.strokeRect(bx,top,bw,bh);
    // 发光窗格（稳定点亮 + 柔和脉动）
    for(let wy=top+8; wy<H-10; wy+=12) for(let wx=bx+4; wx<bx+bw-7; wx+=9){
      if(((wx*7+wy*13+i*3)%11)>4) continue;
      g.globalAlpha=0.30+0.35*(0.5+0.5*Math.sin(t*1.5+i+wx));
      g.fillStyle='#00e5ff'; g.fillRect(wx,wy,4,5);
    }
    g.globalAlpha=1;
  }
  // 品牌霓虹招牌（WavePeak Elite / 浪尖儿）
  g.save(); g.textAlign='center'; g.font='bold 18px monospace';
  g.shadowColor='#00e5ff'; g.shadowBlur=16; g.globalAlpha=0.6+0.4*Math.sin(t*2);
  g.fillStyle='#00e5ff'; g.fillText('WAVEPEAK ELITE', W*0.5, HUD_H+52);
  g.shadowColor='#ff2e88'; g.fillStyle='#ff2e88'; g.globalAlpha=0.6+0.4*Math.sin(t*2+1);
  g.fillText('浪尖儿', W*0.5, HUD_H+78);
  g.globalAlpha=1; g.restore();
  // 钢铁地面平台
  g.fillStyle='rgba(8,12,22,0.72)'; g.fillRect(0,H-86,W,86);
  g.strokeStyle='rgba(0,229,255,0.25)'; g.lineWidth=1;
  for(let xX=0;xX<W;xX+=CELL){ g.beginPath(); g.moveTo(xX,H-86); g.lineTo(xX,H); g.stroke(); }
  // 流动的蓝色能量光带
  for(let b2=0;b2<3;b2++){
    const by=H-16-b2*26, sp=130+b2*45, cx=((t*sp)%(W+120))-60;
    const bg2=g.createLinearGradient(cx-60,0,cx+60,0);
    bg2.addColorStop(0,'rgba(0,229,255,0)'); bg2.addColorStop(0.5,'rgba(0,229,255,0.85)'); bg2.addColorStop(1,'rgba(0,229,255,0)');
    g.fillStyle=bg2; g.fillRect(cx-60,by,120,3);
  }
}

function drawHudBar(m){
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,HUD_H);
  ctx.fillStyle='rgba(0,229,255,0.12)'; ctx.fillRect(0,HUD_H-1,W,1);
}
function drawWalls(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const v=grid[r][c]; if(!v) continue;
    const x=c*CELL, y=HUD_H+r*CELL;
    if(v===2){
      const g=ctx.createLinearGradient(x,y,x,y+CELL);
      g.addColorStop(0,'#8fb3d8'); g.addColorStop(1,'#5a7a9e');
      ctx.fillStyle=g; ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
    } else {
      ctx.fillStyle='#a8663a'; ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
      ctx.strokeStyle='#6e3c18'; ctx.lineWidth=1;
      ctx.strokeRect(x+1,y+1,CELL-2,CELL-2);
      ctx.beginPath(); ctx.moveTo(x,y+CELL/2); ctx.lineTo(x+CELL,y+CELL/2); ctx.stroke();
    }
  }
}

/* ---------------- 工具 ---------------- */
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }

/* ---------------- 段位系统 ---------------- */
const RANKS=[
  {name:'青铜',min:0},{name:'白银',min:8},{name:'黄金',min:20},
  {name:'铂金',min:36},{name:'钻石',min:56},{name:'大师',min:80},{name:'王者',min:110},
];
function rankFor(kills){
  let r=RANKS[0];
  for(const x of RANKS) if(kills>=x.min) r=x;
  return r;
}
// 当前段位进度信息
function rankProgress(kills){
  const cur=rankFor(kills);
  const idx=RANKS.indexOf(cur);
  const next=RANKS[idx+1];
  const have=kills-cur.min;
  const pct = next ? Math.min(100, Math.round(have/(next.min-cur.min)*100)) : 100;
  return { cur, next, need: next ? next.min-kills : 0, have, pct };
}
// 历史最高击杀（localStorage）—— 用于主菜单段位展示与“再战欲望”
const BEST_KEY='wpeak_best';
function getBest(){ try{ return +localStorage.getItem(BEST_KEY)||0; }catch(e){ return 0; } }
function setBest(k){ const b=getBest(); if(k>b){ try{ localStorage.setItem(BEST_KEY,k); }catch(e){} } return Math.max(b,k); }

/* —— 升段全屏横幅 + 庆祝 —— */
function promote(r){
  $('ruName').textContent=r.name;
  $('ruSub').textContent = r.min>=110 ? '技术碾压，已登段位之巅！' : '技术碾压，向更高段位冲刺！';
  const el=$('rankup'); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  sfxRankUp(); flash();
  if(game) for(const p of game.players) if(p.alive) burst(p.x,p.y,'#ffd54a',40,2,280,1);
}
/* —— 战机预览 + 段位预览（主菜单） —— */
function drawPreviewTank(x,cx,cy,m){
  const mm=MODES[m], bx=cx*0.40, by=cy*0.40;
  const char = MODES[m].weapon==='重型坦克' ? '重' : (MODES[m].weapon==='Q版坦克' ? 'Q' : '战');
  // 底盘光晕
  const g=x.createRadialGradient(cx,cy+bx,4,cx,cy+bx,bx*1.2);
  g.addColorStop(0, mm.bullet); g.addColorStop(1,'transparent');
  x.fillStyle=g; x.fillRect(0,0,x.canvas.width,x.canvas.height);
  // 履带
  x.fillStyle=mm.playerDark;
  x.fillRect(cx-bx-5,cy-by,11,by*2); x.fillRect(cx+bx-6,cy-by,11,by*2);
  // 车体
  const gb=x.createLinearGradient(cx,cy-by,cx,cy+by);
  gb.addColorStop(0,mm.player); gb.addColorStop(1,mm.playerDark);
  x.fillStyle=gb; x.fillRect(cx-bx,cy-by,bx*2,by*2);
  // 炮台
  x.fillStyle='#0b0f2b'; x.beginPath(); x.arc(cx,cy,by*0.62,0,7); x.fill();
  x.strokeStyle=mm.player; x.lineWidth=2; x.stroke();
  x.fillStyle=mm.player; x.font='bold 15px "Microsoft YaHei"'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(char, cx, cy);
  x.fillStyle=mm.player;
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+2,cy-by-12); x.lineTo(cx-2,cy-by-12); x.fill();
  // 炮口
  x.fillStyle='#fff'; x.fillRect(cx-4,cy-by-18,8,6);
  x.textBaseline='alphabetic';
}
function updateRankLane(){
  const best=getBest(), rp=rankProgress(best);
  $('rankLane').innerHTML = RANKS.map(r=>{
    const on = best>=r.min, active = r===rp.cur;
    return '<span class="rk '+(active?'active':'')+' '+(on?'on':'')+'">'+r.name+'</span>';
  }).join('');
  $('rankNote').textContent = best>0
    ? ('当前历史最高：'+rp.cur.name+(rp.next?' · 距 '+rp.next.name+' 还需 '+rp.need+' 击杀':'已登顶')+' —— 刷新纪录，点亮更高段位！')
    : '你的段位记录将在这里点亮，出击去战斗吧！';
}
function renderPreview(){
  const c=$('ptank'), x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  drawPreviewTank(x, c.width/2, c.height/2, mode);
  $('ptankName').textContent='当前战机 · '+MODES[mode].weapon;
  updateRankLane();
}

/* ---------------- DOM 层管理 ---------------- */
const $=id=>document.getElementById(id);
const startScreen=$('startScreen'), endScreen=$('endScreen'), hud=$('hud');
const flashEl=$('flash'), msgEl=$('overlay-msg');

function showScreen(scr,on){ if(scr) scr.classList.toggle('active',on); }
function flash(){
  flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
}
function showMsg(text){
  msgEl.textContent=text; msgEl.classList.remove('show'); void msgEl.offsetWidth; msgEl.classList.add('show');
}
function updateHud(){
  if(!game){ return; }
  const p=game.players[0];
  const fill=$('hpFill'), txt=$('hpText');
  fill.style.width = (p.hp/p.maxHp*100)+'%';
  fill.style.background = p.hp>2 ? 'linear-gradient(#3dff6e,#0fae4a)'
                      : p.hp===2 ? 'linear-gradient(#ffe259,#ff9e1b)' : 'linear-gradient(#ff4f5e,#b52031)';
  txt.textContent = p.hp + '/' + p.maxHp;
  $('hudScore').textContent=game.score;
  $('hudKills').textContent=game.kills;
  $('hudRank').textContent=rankFor(game.kills).name;
  $('hudLevel').textContent=p.level;
}

/* ---------------- 模式选择 ---------------- */
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    sfxClick();
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    mode = btn.dataset.mode;
    renderPreview();                       // 切换模式 → 刷新战机/段位预览
    document.body.classList.toggle('female', mode==='female');
    battleCall();              // 选择男生/女生模式后，用对应语气播报「开始战斗」
  });
});
document.querySelectorAll('.pmode').forEach(btn=>{
  btn.addEventListener('click',()=>{
    sfxClick();
    document.querySelectorAll('.pmode').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    playMode=btn.dataset.p;
  });
});

/* ---------------- 游戏流程 ---------------- */
function startGame(){
  stopMenuBgm();               // 进入战斗：先停掉菜单氛围音乐，避免与战斗 BGM 重合
  audio(); startBgm();
  clearInput();
  grid=buildMap();
  particles.length=0;
  game=new Game();
  state='playing';
  showScreen(startScreen,false); showScreen(endScreen,false); hud.style.display='block';
  updateHud();
}
function endGame(){
  state='over';
  const p0 = game.players[0];
  overInfo={ kills:game.kills, score:game.score, level:p0.level };
  stopBgm(); sfxExplosion(true); startMenuBgm();
  showScreen(endScreen,true); hud.style.display='none';
  $('endScore').textContent='SCORE '+game.score;
  $('endKills').textContent=game.kills;
  $('endLvl').textContent=p0.level;
  $('endMode').textContent=MODES[mode].label + (playMode==='duo' ? ' · 合作' : '');
  const rp=rankProgress(game.kills);
  const best=setBest(game.kills);          // 记录历史最高 → 点亮主菜单段位
  $('endRank').textContent='达成段位：'+rp.cur.name;
  // 段位进度条
  $('endRankTip').textContent = rp.next ? ('距 '+rp.next.name+' 还需 '+rp.need+' 击杀') : '已达最高段位 · 王者之巅！';
  $('endRankFill').style.width = rp.pct+'%';
  $('endRankLabel').textContent = rp.cur.name + (rp.next ? ' · '+rp.need+' 击杀即可晋升 ' : ' · 已登顶王者');
  // 再战文案：激发再来一局的欲望
  let boost;
  if(rp.next && rp.need<=3) boost='只差 '+rp.need+' 次击杀！再来一局，马上晋升 '+rp.next.name+'！';
  else if(rp.next) boost='再冲一把，叩响 '+rp.next.name+' 的大门吧——你离高手只差一次坚持！';
  else boost='已登顶最高段位！挑战更强发挥，冲击全新纪录！';
  $('endBoost').textContent='💪 '+boost;
}
$('btnStart').addEventListener('click',()=>{ sfxClick(); startGame(); });
$('btnRetry').addEventListener('click',()=>{ sfxClick(); startGame(); });
$('btnMenu').addEventListener('click',()=>{ sfxClick(); stopBgm(); startMenuBgm(); showScreen(endScreen,false); showScreen(startScreen,true); state='menu'; renderPreview(); });

/* ---------------- 主循环 ---------------- */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  if(state==='playing' && game){
    game.update(dt);
    game.draw();
  } else if(state==='menu' || state==='over'){
    // 菜单/结算时仍渲染一次背景（演示）
    drawAmbient();
  }
  // 玩家无敌闪烁已由 draw 处理
}
function drawAmbient(){
  drawBG();
  const g=buildMap();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(g[r][c]){
    const x=c*CELL,y=HUD_H+r*CELL;
    ctx.fillStyle=g[r][c]===2?'rgba(200,225,255,0.55)':'rgba(255,220,180,0.45)';
    ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
  }
}

// 首次渲染画布背景
grid=buildMap();
drawAmbient();
requestAnimationFrame(loop);
renderPreview();   // 初始渲染主菜单的战机/段位预览
// 主菜单：首次用户交互（任意手势）初始化音频 + 播氛围音乐 + 欢迎语（兼顾浏览器自动播放策略）
let menuBgmStarted=false;
function firstInteract(){
  if(menuBgmStarted) return;
  menuBgmStarted=true;
  audio();               // 在用户手势内创建/恢复 AudioContext，保证菜单音效可播放
  startMenuBgm();
  welcomeSpeak();        // 「欢迎来到浪尖社区…」
}
['pointerdown','mousedown','touchstart','keydown'].forEach(ev=>
  window.addEventListener(ev, firstInteract, { passive:true }));
</script>
